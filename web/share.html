<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shared song</title>
<!--META-->
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; --bg: #0b0b12; --panel: #161622; --text: #f3f3f8; --muted: #9a9ab0; --accent: #8b5cf6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 30% 0%, #2a1b4a, var(--bg) 60%); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
  .card { width: min(420px, 100%); background: var(--panel); border-radius: 20px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); text-align: center; }
  .art { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #22223a; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 22px; margin: 18px 0 2px; }
  .muted { color: var(--muted); }
  audio { width: 100%; margin-top: 16px; }
  .foot { margin-top: 16px; font-size: 13px; }
  .small { font-size: 13px; margin-top: 6px; }
  a { color: var(--accent); }
  .err { padding: 30px 0; }
</style>
</head>
<body>
<div class="card" id="card"><div class="muted">Loading…</div></div>
<script>
(async () => {
  const token = location.pathname.split('/').pop();
  const card = document.getElementById('card');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  try {
    const r = await fetch(`/api/share/${encodeURIComponent(token)}`);
    if (!r.ok) throw new Error((await r.json()).detail || 'Not found');
    const t = await r.json();
    document.title = `${t.title} – ${t.artist}`;
    const khz = (hz) => String(Math.round(hz / 100) / 10);
    const quality = [t.format ? String(t.format).toUpperCase() : '',
      t.lossless && t.bit_depth && t.sample_rate ? `${t.bit_depth}-bit / ${khz(t.sample_rate)} kHz` : t.lossless && t.sample_rate ? `${khz(t.sample_rate)} kHz` : t.bitrate ? `${t.bitrate} kbps` : '',
      t.duration ? `${Math.floor(t.duration / 60)}:${String(Math.round(t.duration % 60)).padStart(2, '0')}` : ''].filter(Boolean).join(' · ');
    card.innerHTML = `<div class="art"><img src="/api/share/${encodeURIComponent(token)}/cover" alt="" onerror="this.remove()"></div>
      <h1>${esc(t.title)}</h1><div class="muted">${esc(t.artist)}${t.album ? ' · ' + esc(t.album) + (t.year ? ' (' + esc(t.year) + ')' : '') : ''}</div>
      ${quality ? `<div class="muted small">${esc(quality)}</div>` : ''}
      <audio controls preload="metadata" src="/api/share/${encodeURIComponent(token)}/stream"></audio>
      <div class="foot muted">Shared from ${esc(t.app_name || 'Encore')} · <a href="/#/login">Sign in</a> for the whole library</div>`;
    const a = card.querySelector('audio');
    a.onerror = () => { if (!a.src.includes('transcode')) a.src += '?transcode=true'; };
  } catch (e) {
    card.innerHTML = `<div class="err"><h1>Link not available</h1><div class="muted">${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
