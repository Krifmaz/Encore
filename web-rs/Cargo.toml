[package]
name = "encore-web"
version = "0.0.0"
description = "Encore's web app in Rust (WebAssembly) – a 1:1 port of web/js: same DOM, same CSS, same behaviour"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
gloo-events = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-utils = "0.2"
gloo-net = { version = "0.6", features = ["http"] }
futures = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlButtonElement",
  "HtmlAnchorElement", "HtmlImageElement", "HtmlAudioElement", "HtmlMediaElement", "HtmlFormElement", "HtmlCollection",
  "Storage", "Location", "History", "Headers", "Request", "RequestInit", "RequestCredentials", "Response", "MediaSession",
  "MediaMetadata", "MediaMetadataInit", "MediaImage", "MediaSessionAction", "MediaSessionActionDetails", "MediaSessionPlaybackState",
  "Navigator", "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "PointerEvent", "TouchEvent", "Touch", "TouchList", "CustomEvent", "CustomEventInit",
  "HashChangeEvent", "Node", "NodeList", "DomRect", "CssStyleDeclaration", "DomStringMap", "DomTokenList", "File", "FileList",
  "FormData", "Blob", "Url", "UrlSearchParams", "ScrollToOptions", "ScrollBehavior", "MediaQueryList", "Clipboard",
  "Notification", "NotificationOptions", "NotificationPermission", "ServiceWorkerContainer", "AbortController", "AbortSignal",
  "MutationObserver", "MutationObserverInit", "MutationRecord", "Screen", "ScreenOrientation", "DocumentFragment", "Text",
  "TimeRanges", "HtmlLabelElement", "HtmlDivElement", "InputEvent", "DragEvent", "DataTransfer", "ProgressEvent",
  "WheelEvent", "FocusEvent", "console", "FileReader", "AnimationEvent", "TransitionEvent", "VisibilityState", "Crypto", "Performance",
  "EventSource", "MessageEvent", "AudioContext", "BaseAudioContext", "StorageEvent",
  "AudioNode", "AudioParam", "BiquadFilterNode", "BiquadFilterType", "GainNode", "DelayNode", "StereoPannerNode", "ChannelSplitterNode",
  "ChannelMergerNode", "MediaElementAudioSourceNode", "AudioDestinationNode", "ChannelCountMode", "ChannelInterpretation", "AudioContextState",
  "RequestCache", "WebSocket",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
