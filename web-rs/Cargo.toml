[package]
name = "encore-web"
version = "0.0.0"
description = "Encore's web app in Rust (WebAssembly) – a 1:1 port of web/js: same DOM, same CSS, same behaviour"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
# Lints on top of clippy's defaults that catch wasted copies: a String or Vec copied with to_string/to_owned
# where clone (or nothing) would do, and to_string through an extra reference (the slow, generic path).
# Where CI runs clippy with -D warnings they cannot creep back in. redundant_clone and needless_collect are
# left out on purpose: they are nursery lints whose suggestions here would not compile (a value used after
# the clone it "doesn't need"; a collect that ends a borrow), so run them by hand now and then instead.
implicit_clone = "warn"
inefficient_to_string = "warn"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
# the equalizer: Cadenza's bands and maths (the same as the desktop app and the phone)
cadenza-eq = { git = "https://github.com/Krifmaz/cadenza", rev = "fc57f0c" }
console_error_panic_hook = "0.1"
gloo-events = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
futures = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement",
  "HtmlImageElement", "HtmlMediaElement", "HtmlFormElement",
  "Storage", "Location", "Headers", "Request", "RequestInit", "RequestCredentials", "Response", "RequestCache",
  "Navigator", "Clipboard", "ServiceWorkerContainer", "Screen", "Performance", "MediaQueryList",
  "ServiceWorker", "ServiceWorkerRegistration", "ServiceWorkerState",
  "MediaMetadata", "MediaSessionActionDetails",
  "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "PointerEvent", "WheelEvent", "CustomEvent", "CustomEventInit",
  "HashChangeEvent", "StorageEvent", "MessageEvent", "EventSource",
  "Node", "NodeList", "Text", "DomRect", "CssStyleDeclaration", "DomTokenList", "TimeRanges",
  "File", "FileList", "DataTransfer", "DataTransferItem", "DataTransferItemList", "EventInit", "FileReader", "FormData", "Url", "UrlSearchParams", "ScrollToOptions", "ScrollBehavior",
  "MutationObserver", "MutationObserverInit", "MutationRecord", "console",
  "AudioContext", "AudioContextState", "AudioNode", "AudioParam", "AudioDestinationNode", "MediaElementAudioSourceNode",
  "BiquadFilterNode", "BiquadFilterType", "IirFilterNode", "BaseAudioContext", "GainNode", "DelayNode", "StereoPannerNode", "ChannelSplitterNode", "ChannelMergerNode",
  "ChannelCountMode", "ChannelInterpretation",
  # the offline store (src/offline): the Cache API, storage estimate/persist, downloads read in pieces
  "CacheStorage", "Cache", "StorageManager", "StorageEstimate", "Blob", "BlobPropertyBag", "ReadableStream",
  "ReadableStreamDefaultReader", "ResponseInit", "AbortController", "AbortSignal",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
