<!doctype html>
<!-- The public share page (/s/<token>): a song, album, artist or playlist anyone with the link can play.
     It wears Encore's own look through the app's stylesheet: data-theme="encore" picks the charcoal-and-cream
     palette, data-brand the logo's cream accent (both in css/app.css), so a change to the app's theme reaches
     this page too. The styles below lay the page out and only ever use the theme's variables for colour; a test
     in web-rs/src/appearance.rs checks that. The server fills in the link-preview tags (share_page_html in the api crate). -->
<html lang="en" data-theme="encore" data-brand data-bg="solid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- the browser bar, and the colour bar of the link's card in chat apps that read it: the brand accent -->
<meta name="theme-color" content="#f0ead6">
<title>Shared song</title>
<!--META-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* the page: one card in the middle, over the cover blurred (as in the app's full-screen player) */
  html, body { height: auto; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; overflow-x: hidden; }
  .sp-backdrop { position: fixed; inset: -60px; background: center / cover no-repeat; filter: blur(60px) saturate(1.3); opacity: .35; pointer-events: none; z-index: 0; }
  .share { position: relative; z-index: 1; width: min(440px, 100%); padding: 22px; box-shadow: var(--shadow); text-align: center; }
  .art { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: var(--panel-2); box-shadow: var(--shadow); }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .share h1 { font-size: 24px; margin: 18px 0 4px; overflow-wrap: anywhere; }
  .share .small { font-size: 13px; margin-top: 4px; }
  .share a { color: var(--accent); }
  .share a:hover { text-decoration: underline; }
  .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .err { padding: 30px 0; }
  .err h1 { margin-top: 0; }
  .empty { padding: 24px 0 8px; }
  .loading { padding: 30px 0; }

  /* the player: the app's round play button and its accent-filled seek bar, with the time on both sides */
  .sp { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 16px; }
  .sp audio { display: none; }
  .sp-seek { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); }
  .sp-seek span { min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
  .sp-seek input { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 26px; margin: 0; background: transparent; cursor: pointer; touch-action: none; --p: 0%; }
  .sp-seek input::-webkit-slider-runnable-track { height: 5px; border-radius: 99px; background: linear-gradient(90deg, var(--accent) var(--p), var(--border) var(--p)); }
  .sp-seek input::-moz-range-track { height: 5px; border-radius: 99px; background: linear-gradient(90deg, var(--accent) var(--p), var(--border) var(--p)); }
  .sp-seek input::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px; border-radius: 50%; background: var(--text); border: 0; }
  .sp-seek input::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--text); border: 0; }
  .sp .play-btn { width: 56px; height: 56px; }
  .sp .play-btn svg { width: 22px; height: 22px; }
  .sp .play-btn:active { transform: scale(.96); }

  /* the songs of an album, artist or playlist: the playing one in the accent colour */
  .songs { list-style: none; margin: 14px 0 0; padding: 0; text-align: left; max-height: 360px; overflow-y: auto; }
  .songs button { width: 100%; display: flex; gap: 10px; align-items: baseline; background: none; border: 0; border-radius: 10px; padding: 7px 8px; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .songs button:hover, .songs button.on { background: var(--panel-2); }
  .songs button.on .t { color: var(--accent); font-weight: 600; }
  .songs .n { width: max(22px, calc(var(--nw, 0px) + 2px)); flex: none; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .songs .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .songs .d { flex: none; font-size: 13px; }
  .songs .more button { justify-content: center; color: var(--accent); }

  /* Play / Shuffle / Add / Save a copy: the app's buttons */
  .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btns .small { align-self: center; margin-top: 0; }

  /* "Shared from Encore", after the app's logo */
  .foot { margin-top: 16px; font-size: 13px; }
  .foot img { display: inline-block; width: 18px; height: 18px; border-radius: 5px; margin-right: 7px; vertical-align: -4px; }
</style>
</head>
<body>
<div class="sp-backdrop" aria-hidden="true"></div>
<div class="card share" id="card"><div class="muted loading">Loading…</div></div>
<script>
(async () => {
  const token = location.pathname.split('/').pop();
  const card = document.getElementById('card');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clock = (d) => { const s = Math.round(d); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  // the app's play and pause icons (ui.rs `icon`)
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  // The player's markup: a hidden <audio> (`preload`, optional `src`; `d` = the song's length in seconds, for
  // a stream that doesn't tell its own, such as a transcoded one), the play button and the seek bar.
  const player = (preload, src, d) => `<div class="sp"><audio preload="${preload}"${src ? ` src="${src}"` : ''}${d ? ` data-d="${Number(d)}"` : ''}></audio>
    <button type="button" class="play-btn" aria-label="Play">${ICON_PLAY}</button>
    <div class="sp-seek"><span class="sp-cur">0:00</span><input type="range" min="0" max="1000" step="1" value="0" aria-label="Seek"><span class="sp-dur">–:––</span></div></div>`;
  // Wires a player (see `player`) to its <audio>: the button plays and pauses, the bar follows the song and
  // seeks when let go. Listeners are added (not set), so the callers' onended / onerror stay theirs.
  const wire = (a) => {
    const root = a.closest('.sp');
    const pp = root.querySelector('.play-btn'), seek = root.querySelector('input'), cur = root.querySelector('.sp-cur'), dur = root.querySelector('.sp-dur');
    let dragging = false;
    const length = () => (Number.isFinite(a.duration) && a.duration > 0 ? a.duration : Number(a.dataset.d) || 0);
    const paint = () => {
      const d = length();
      if (!dragging) seek.value = d ? Math.round(Math.min(a.currentTime / d, 1) * 1000) : 0;
      seek.style.setProperty('--p', `${seek.value / 10}%`);
      cur.textContent = clock(dragging ? (seek.value / 1000) * d : a.currentTime);
      dur.textContent = d ? clock(d) : '–:––';
    };
    const state = () => {
      pp.innerHTML = a.paused ? ICON_PLAY : ICON_PAUSE;
      pp.setAttribute('aria-label', a.paused ? 'Play' : 'Pause');
    };
    pp.onclick = () => { if (a.paused) a.play().catch(() => {}); else a.pause(); };
    seek.oninput = () => { dragging = true; paint(); };
    seek.onchange = () => {
      const d = length();
      if (d) a.currentTime = (seek.value / 1000) * d;
      dragging = false;
      paint();
    };
    ['loadstart', 'timeupdate', 'durationchange', 'loadedmetadata', 'emptied', 'seeked'].forEach((e) => a.addEventListener(e, paint));
    ['play', 'pause', 'ended', 'emptied'].forEach((e) => a.addEventListener(e, state));
    paint();
    state();
  };
  // the cover, blurred behind the card once it has loaded (a link without a picture keeps the plain background)
  const backdrop = (src) => {
    const im = new Image();
    im.onload = () => { document.querySelector('.sp-backdrop').style.backgroundImage = `url("${src}")`; };
    im.src = src;
  };
  // "Shared from Encore", with the app's icon, and the sign-in link when it applies
  const foot = (app, signIn) => `<div class="foot muted"><img src="/favicon.svg" alt=""><span>Shared from ${esc(app || 'Encore')}${signIn ? ' · <a href="/#/login">Sign in</a> for the whole library' : ''}</span></div>`;
  try {
    const r = await fetch(`/api/share/${encodeURIComponent(token)}`);
    if (!r.ok) throw new Error((await r.json()).detail || 'Not found');
    const t = await r.json();
    const tok = encodeURIComponent(token);
    const mmss = clock;
    backdrop(`/api/share/${tok}/cover`);
    if (t.kind === 'playlist') {
      // a playlist as it is now: the header counts the whole list, the songs come in pages of 200
      document.title = `${t.title} · ${t.owner}`;
      const n = t.count || 0;
      const long = (d) => { const s = Math.round(d); return s < 3600 ? mmss(s) : `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`; };
      const head = `${n} ${n === 1 ? 'song' : 'songs'}${t.duration ? ' · ' + long(t.duration) : ''}`;
      const viewer = t.viewer || {};
      // a signed-in listener who didn't make the link: Add to my playlists (live, read-only) and Save a copy
      const other = viewer.signed_in && !viewer.own;
      const openLink = (id) => ` · <a href="/#/playlists/${encodeURIComponent(id)}">Open</a>`;
      const addPart = !other ? '' : viewer.added
        ? `<span class="muted small" id="add-state">Already in your playlists${openLink(viewer.playlist_id)}</span>`
        : '<button type="button" class="btn" id="add">Add to my playlists</button>';
      card.innerHTML = `<div class="art"><img src="/api/share/${tok}/cover" alt="" onerror="this.remove()"></div>
        <h1>${esc(t.title)}</h1><div class="muted">${t.liked ? 'Liked songs' : 'Playlist'} · ${esc(t.owner)}</div>
        ${t.description ? `<div class="muted small desc">${esc(t.description)}</div>` : ''}
        <div class="muted small">${esc(head)}</div>
        ${n ? `<div class="btns"><button type="button" class="btn primary" id="play">Play</button><button type="button" class="btn" id="shuffle">Shuffle</button>${addPart}${other ? '<button type="button" class="btn" id="copy">Save a copy</button>' : ''}</div>
        <div class="muted small" id="copy-msg" hidden></div>
        ${player('none')}
        <ol class="songs"></ol>` : `${addPart ? `<div class="btns">${addPart}</div>
        <div class="muted small" id="copy-msg" hidden></div>` : ''}<div class="muted empty">No songs here right now</div>`}
        ${foot(t.app_name, !viewer.signed_in)}`;
      const add = card.querySelector('#add');
      if (add) add.onclick = async () => {
        const msg = card.querySelector('#copy-msg');
        add.disabled = true;
        msg.hidden = true;
        try {
          const r = await fetch(`/api/share/${tok}/add`, { method: 'POST', headers: { 'x-requested-with': 'encore', 'content-type': 'application/json' }, body: '{}' });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.detail || 'Could not add it');
          add.outerHTML = `<span class="muted small" id="add-state">${j.added ? 'Added to your playlists' : 'Already in your playlists'}${openLink(j.id)}</span>`;
        } catch (e) {
          msg.textContent = e.message;
          msg.hidden = false;
          add.disabled = false;
        }
      };
      if (!n) return;
      const a = card.querySelector('audio');
      wire(a);
      const list = card.querySelector('.songs');
      // the number column fits the longest number (song 1000 of a long list)
      list.style.setProperty('--nw', `${String(n).length}ch`);
      const first = { rows: t.tracks || [], more: !!t.has_more };
      let songs = first.rows.slice(), more = first.more;
      let seed = null, cur = -1, loading = null, gen = 0;
      const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting)) load(); }, { root: list, rootMargin: '120px' }) : null;
      const mark = () => list.querySelectorAll('button[data-i]').forEach((b) => b.classList.toggle('on', Number(b.dataset.i) === cur));
      const render = (rows, from) => {
        list.querySelector('.more')?.remove();
        list.insertAdjacentHTML('beforeend', rows.map((x, j) => `<li><button type="button" data-i="${from + j}"><span class="n muted">${from + j + 1}</span><span class="t">${esc(x.title)}${x.artist ? `<span class="muted"> · ${esc(x.artist)}</span>` : ''}</span><span class="d muted">${x.duration ? mmss(x.duration) : ''}</span></button></li>`).join(''));
        if (more) {
          list.insertAdjacentHTML('beforeend', '<li class="more"><button type="button">More songs</button></li>');
          if (io) { io.disconnect(); io.observe(list.querySelector('.more')); }
        }
        mark();
      };
      // the next page (one request at a time); a shuffle asks for the same seed, so its pages fit together
      const load = () => {
        if (loading || !more) return loading || Promise.resolve();
        const g = gen;
        loading = fetch(`/api/share/${tok}?offset=${songs.length}&limit=200${seed ? `&shuffle=${seed}` : ''}`)
          .then((r) => r.ok ? r.json() : Promise.reject(new Error()))
          .then((p) => {
            if (g !== gen) return;
            const from = songs.length;
            songs = songs.concat(p.tracks || []);
            more = !!p.has_more;
            render(p.tracks || [], from);
          })
          .catch(() => {})
          .finally(() => { if (g === gen) loading = null; });
        return loading;
      };
      const restart = (rows, hasMore, s) => {
        gen++; loading = null; seed = s; songs = rows; more = hasMore; cur = -1;
        list.innerHTML = '';
        render(rows, 0);
      };
      const pick = (i, play) => {
        if (!songs[i]) return;
        cur = i;
        mark();
        a.dataset.d = songs[i].duration || '';
        a.src = `/api/share/${tok}/stream?track=${encodeURIComponent(songs[i].id)}`;
        if (play) a.play().catch(() => {});
      };
      list.onclick = (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.closest('.more')) load(); else pick(Number(b.dataset.i), true);
      };
      // Play: the list order again, from the top
      card.querySelector('#play').onclick = () => {
        if (seed !== null) restart(first.rows.slice(), first.more, null);
        pick(0, true);
      };
      // Shuffle: the whole list in a new order, shown as it plays. Safari only lets sound start inside the
      // click, and the new order's first page comes after it: a stopped player is started (muted) and paused
      // now, which lets it play the first song once the page is here.
      card.querySelector('#shuffle').onclick = async () => {
        if (a.paused) {
          const muted = a.muted;
          a.muted = true;
          a.play().then(() => a.pause()).catch(() => {}).finally(() => { a.muted = muted; });
        }
        restart([], true, 1 + Math.floor(Math.random() * 2147483646));
        await load();
        pick(0, true);
      };
      a.onended = async () => {
        if (cur + 1 >= songs.length && more) await load();
        if (cur + 1 < songs.length) pick(cur + 1, true);
      };
      a.onerror = () => { if (cur >= 0 && a.src && !a.src.includes('transcode')) { a.src += '&transcode=true'; a.play().catch(() => {}); } };
      const copy = card.querySelector('#copy');
      if (copy) copy.onclick = async () => {
        const msg = card.querySelector('#copy-msg');
        copy.disabled = true;
        msg.hidden = true;
        try {
          const r = await fetch(`/api/share/${tok}/copy`, { method: 'POST', headers: { 'x-requested-with': 'encore', 'content-type': 'application/json' }, body: '{}' });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.detail || 'Could not save a copy');
          copy.outerHTML = `<span class="muted small">Saved to your playlists · <a href="/#/playlists/${encodeURIComponent(j.id)}">Open</a></span>`;
        } catch (e) {
          msg.textContent = e.message;
          msg.hidden = false;
          copy.disabled = false;
        }
      };
      render(songs, 0);
      pick(0, false);
      return;
    }
    if (t.kind === 'album' || t.kind === 'artist') {
      document.title = t.kind === 'album' ? `${t.title} – ${t.artist}` : t.title;
      const songs = t.tracks || [];
      const sub = t.kind === 'album' ? [t.artist, t.year].filter(Boolean).join(' · ') : 'Artist';
      const count = `${songs.length} ${songs.length === 1 ? 'song' : 'songs'}${t.kind === 'album' && t.duration ? ' · ' + mmss(t.duration) : ''}`;
      card.innerHTML = `<div class="art"><img src="/api/share/${tok}/cover" alt="" onerror="this.remove()"></div>
        <h1>${esc(t.title)}</h1><div class="muted">${esc(sub)}</div>
        <div class="muted small">${esc(count)}</div>
        ${player('none')}
        <ol class="songs">${songs.map((x, i) => {
          const extra = t.kind === 'artist' ? x.album : (x.artist && x.artist !== t.artist ? x.artist : '');
          return `<li><button type="button" data-i="${i}"><span class="n muted">${i + 1}</span><span class="t">${esc(x.title)}${extra ? `<span class="muted"> · ${esc(extra)}</span>` : ''}</span><span class="d muted">${x.duration ? mmss(x.duration) : ''}</span></button></li>`;
        }).join('')}</ol>
        ${foot(t.app_name, true)}`;
      const a = card.querySelector('audio');
      wire(a);
      const buttons = [...card.querySelectorAll('.songs button')];
      let cur = -1;
      const pick = (i, play) => {
        cur = i;
        buttons.forEach((b, j) => b.classList.toggle('on', j === i));
        a.dataset.d = songs[i].duration || '';
        a.src = `/api/share/${tok}/stream?track=${encodeURIComponent(songs[i].id)}`;
        if (play) a.play().catch(() => {});
      };
      buttons.forEach((b, i) => { b.onclick = () => pick(i, true); });
      a.onended = () => { if (cur + 1 < songs.length) pick(cur + 1, true); };
      a.onerror = () => { if (cur >= 0 && a.src && !a.src.includes('transcode')) { a.src += '&transcode=true'; a.play().catch(() => {}); } };
      if (songs.length) pick(0, false);
      return;
    }
    document.title = `${t.title} – ${t.artist}`;
    const khz = (hz) => String(Math.round(hz / 100) / 10);
    const quality = [t.format ? String(t.format).toUpperCase() : '',
      t.lossless && t.bit_depth && t.sample_rate ? `${t.bit_depth}-bit / ${khz(t.sample_rate)} kHz` : t.lossless && t.sample_rate ? `${khz(t.sample_rate)} kHz` : t.bitrate ? `${t.bitrate} kbps` : '',
      t.duration ? `${Math.floor(t.duration / 60)}:${String(Math.round(t.duration % 60)).padStart(2, '0')}` : ''].filter(Boolean).join(' · ');
    card.innerHTML = `<div class="art"><img src="/api/share/${encodeURIComponent(token)}/cover" alt="" onerror="this.remove()"></div>
      <h1>${esc(t.title)}</h1><div class="muted">${esc(t.artist)}${t.album ? ' · ' + esc(t.album) + (t.year ? ' (' + esc(t.year) + ')' : '') : ''}</div>
      ${quality ? `<div class="muted small">${esc(quality)}</div>` : ''}
      ${player('metadata', `/api/share/${encodeURIComponent(token)}/stream`, t.duration)}
      ${foot(t.app_name, true)}`;
    const a = card.querySelector('audio');
      wire(a);
    a.onerror = () => { if (!a.src.includes('transcode')) a.src += '?transcode=true'; };
  } catch (e) {
    document.title = 'Link not available';
    card.innerHTML = `<div class="err"><h1>Link not available</h1><div class="muted">${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
