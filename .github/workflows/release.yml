name: release

# Every run makes a normal GitHub release tagged v<version>. Versions are plain MAJOR.MINOR.PATCH: by
# default the next number bumps PATCH of the newest release; pick "minor"/"major" or type the version
# by hand (e.g. 1.0.0). The tag is created through the release (the API may create tags; a git push
# from the Actions token may not).
#   Start one: Actions → release → Run workflow.
#   Every merge to the default branch makes one too (release-on-merge.yml, bump "auto": PATCH, or MINOR/MAJOR when
#   the merge adds docs/releases/<that version>.md), with the server and Docker image only.
#   Tick "apps" to also build the desktop installers and the Android APK (the macOS runner costs 10× minutes,
#   so they are off by default and a release without them is just the server + Docker image, with the apps of the
#   previous release attached again). They can be built on your own machine instead and attached to the release:
#   scripts/release-apps.sh.
#   Desktop: the native app (clients/desktop).
#   If the macOS desktop job waits for a runner, cancel the run after the server, Docker, Android, Windows and Linux
#   jobs are done: publish still runs and the notes name what is missing. GitHub itself cancels a job no runner
#   takes within about 15 minutes; either way, mac-backfill.yml adds the Mac app to the published release later. A cancel after the server and Docker jobs
#   succeeded does not stop the release; delete it afterwards if that was the point.
#   Docker: :<version> and :latest.
#   Notes: docs/releases/<version>.md if it exists, otherwise the commit list since the previous release.
#   Checks first (the `test` job, which pull requests run too through docker.yml): the server's tests and clippy
#   for every crate of the workspace, the web app's checks, and whether Cadenza is pinned to one rev everywhere.
#   The x86_64 server build of a release started by hand also runs the speed table (server/benches/perf.rs) into
#   its job summary.
#   SHA256SUMS covers every file of the release; the desktop app checks its updates against it.
# The steps themselves are the Krifmaz kit's shared workflows (github.com/Krifmaz/kit, .github/workflows/): kit-ci
# (the checks), kit-release (version, web app, server tarballs, notes, SHA256SUMS, the release), kit-docker,
# kit-android and kit-desktop. What is Encore's own (names, install notes, the extension, old installer names) is
# passed to them below.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number to bump for the next version"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or type the version to release (MAJOR.MINOR.PATCH); overrides bump"
        type: string
        default: ""
      apps:
        description: "Also build desktop + Android apps (slow, costs macOS minutes)"
        type: boolean
        default: false
      only:
        description: "Build only part of it: 'android' = the Android APK with the server and Docker image (always built, so servers can update to it); only the desktop apps are carried over from the previous release"
        type: choice
        options: [all, android]
        default: all
  # release-on-merge.yml: every merge to the default branch
  workflow_call:
    inputs:
      bump:
        type: string
        required: false
        default: auto

permissions:
  contents: write
  packages: write

# releases queue one after the other
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The checks every release and every pull request runs (docker.yml runs the same).
  test:
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@93ef80f21b96e67489359f1c038e71d4750db095
    with:
      rust-dirs: server
      wasm-dirs: web-rs
      # Encore's code is not cargo fmt'ed (its own style); the kit's code is
      fmt: false
      # The server, the desktop app and the phone build the same Cadenza engine and move their pins to a new rev
      # together (scripts/check-cadenza-pins.sh lists them). Not blocking yet: the desktop app is ahead of the
      # server and the phone, and moving the server's pin changes what its Cadenza processing renders, which a
      # structure-only release (0.29) leaves alone. The step shows the differing pins; once they match, make it a
      # `check` so a split can't come back.
      advisory-name: Cadenza is pinned to the same rev everywhere
      advisory: bash scripts/check-cadenza-pins.sh

  # the version, the web app (web-rs → static/) and the server tarballs for x86_64 and aarch64
  prepare:
    needs: test
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@93ef80f21b96e67489359f1c038e71d4750db095
    with:
      stage: prepare
      app-name: Encore
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}
      # the first numbered release after the date-based ones
      first-version: "0.20.0"
      # Android versionCode, always increasing and above the old date-based codes (26101302 …):
      # 260000000 + major*1000000 + minor*10000 + patch*10
      code-base: 260000000
      web-dir: web-rs
      web-files: index.html sw.js share.html css/app.css manifest.webmanifest favicon.svg icons/icon-192.png
      server-dir: server
      server-bin: encore
      version-env: ENCORE_VERSION
      # The speed table (server/benches/perf.rs, the same as docs/perf/), on releases started by hand only (a merge's
      # release skips it, as the hotfixes did). -p encore: a bench across the workspace would turn on encore-core's
      # test-only fault-io feature (through encore-api's and encore-requests' dev-dependencies), which refuses a
      # release build
      bench: ${{ github.event_name == 'workflow_dispatch' && 'cargo bench -p encore --locked --target "$TARGET" --bench perf' || '' }}

  docker:
    # an Android-only release too: the in-app updater pulls :<version> of every release
    needs: prepare
    uses: Krifmaz/kit/.github/workflows/kit-docker.yml@93ef80f21b96e67489359f1c038e71d4750db095
    with:
      image: encore
      version: ${{ needs.prepare.outputs.version }}
      build-args: |
        ENCORE_BUILD=${{ github.sha }}
        ENCORE_VERSION=${{ needs.prepare.outputs.version }}

  # The native Android app (clients/android), Encore-android-<version>.apk, signed with the permanent release key
  # from the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD secrets.
  # Cadenza (libencore_cadenza.so) must be in it, 16 KB aligned.
  android:
    needs: prepare
    if: inputs.apps || inputs.only == 'android'
    uses: Krifmaz/kit/.github/workflows/kit-android.yml@93ef80f21b96e67489359f1c038e71d4750db095
    with:
      app-name: Encore
      version: ${{ needs.prepare.outputs.version }}
      code: ${{ needs.prepare.outputs.code }}
      project-dir: clients/android
      version-property: encore
      android-packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      build-tools: "36.0.0"
      ndk: "29.0.13846066"
      rust-targets: aarch64-linux-android,armv7-linux-androideabi
      rust-dir: clients/android/cadenza/rust
      native-libs: libencore_cadenza.so
    secrets:
      android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # The desktop app (clients/desktop, Iced) by scripts/desktop-package.sh: the names its updater looks for
  # (clients/desktop/src/desktop/updater.rs). Windows and Linux carry Cadenza's CUDA offload; macOS has none and is
  # built on Intel for both Mac targets (arm64 Macs ran out of capacity in late October 2026; mac-backfill.yml adds a
  # missed .dmg later).
  desktop:
    needs: prepare
    if: inputs.apps && inputs.only != 'android'
    uses: Krifmaz/kit/.github/workflows/kit-desktop.yml@93ef80f21b96e67489359f1c038e71d4750db095
    with:
      app-name: Encore
      version: ${{ needs.prepare.outputs.version }}
      project-dir: clients/desktop
      package-script: scripts/desktop-package.sh
      linux-features: cuda
      windows-features: cuda
      # ALSA (Cadenza's output), xkbcommon and Wayland (the window), udev; no GTK or libxdo: the tray is ksni over
      # D-Bus and file dialogs use the desktop portal. `file` for appimagetool
      linux-packages: libasound2-dev libxkbcommon-dev libwayland-dev libudev-dev pkg-config file
      linux-check: bash clients/desktop/packaging/check.sh
      linux-files: "Encore-{V}-linux-x86_64.AppImage encore_{V}_amd64.deb"
      windows-files: "Encore-{V}-windows-x86_64.exe"
      macos-files: "Encore-{V}-macos-universal.dmg"
    secrets:
      windows-cert-pfx-base64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      windows-cert-password: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      macos-cert-p12-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      macos-sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
      apple-app-password: ${{ secrets.APPLE_APP_PASSWORD }}

  publish:
    needs: [prepare, docker, android, desktop]
    if: >-
      always() && needs.prepare.result == 'success' && needs.docker.result == 'success' &&
      (inputs.only != 'android' || needs.android.result == 'success')
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@93ef80f21b96e67489359f1c038e71d4750db095
    with:
      stage: publish
      app-name: Encore
      version: ${{ needs.prepare.outputs.version }}
      only: ${{ inputs.only || 'all' }}
      # success when every app built, skipped when none ran
      apps-result: >-
        ${{ (needs.android.result == 'skipped' && needs.desktop.result == 'skipped') && 'skipped' ||
        (needs.android.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')) && 'success' || 'failure' }}
      # Android only: these of the newest release are not kept (built again, or the classic Tauri desktop app removed
      # in 0.29 and its update manifest)
      keep-drop: >-
        Encore-android-*.apk docker-compose.yml encore-*-linux-*.tar.gz
        Encore-Setup-* Encore-classic-* Encore-*-mac.dmg Encore-*-mac.app.tar.gz* Encore-*-linux-amd64.deb Encore-*-linux-x86_64.rpm latest.json
      # the compose file and the YouTube sign-in browser extension (chrome/ and firefox/ folders in one zip)
      files: |
        cp docker-compose.yml "$OUT/"
        rm -f "$OUT"/Encore-youtube-extension-*.zip
        bash scripts/build-extension.sh "$V" "$OUT"
      # the installers; a run that built none of them attaches the previous release's (encore_*.deb is the desktop
      # app's Debian package), without the extension (built fresh) and the classic Tauri desktop app
      app-files: Encore-android-*.apk Encore-*-windows-*.exe Encore-*-linux-x86_64.AppImage Encore-*-macos-universal.dmg
      carry-over: Encore-* encore_*.deb
      carry-over-drop: >-
        Encore-youtube-extension-*.zip Encore-Setup-* Encore-classic-* Encore-*-mac.dmg Encore-*-mac.app.tar.gz*
        Encore-*-linux-amd64.deb Encore-*-linux-x86_64.rpm
      # the install part of the notes
      notes: |
        cat >> "$NOTES" <<EOT

        ---
        ### Install
        * **Docker**: \`ghcr.io/krifmaz/encore:latest\` (\`:$V\` pins this build) · compose file attached
        * **Linux without Docker**: \`encore-$V-linux-x86_64.tar.gz\` / \`-aarch64\` – run \`ENCORE_CONFIG_DIR=./config ENCORE_STATIC_DIR=./static ./encore\` (the yt-dlp and streamrip plugins need uv and Python 3.14 on the host, python3.14 in /usr/bin or /usr/local/bin; the Docker image has both)
        * **YouTube sign-in extension**: \`Encore-youtube-extension-$V.zip\` – load the chrome or firefox folder (see extension/encore-youtube-cookies/README.md)
        EOT
        if [ "$ONLY" = android ]; then cat >> "$NOTES" <<EOT
        * **Android**: \`Encore-android-$V.apk\` (this build) · the desktop apps are from the previous release
        EOT
        elif [ "$APPS" = success ]; then cat >> "$NOTES" <<EOT
        * **Android**: \`Encore-android-$V.apk\`
        * **Desktop app** (native, with Cadenza playing on this computer; it updates itself): **Windows** \`Encore-$V-windows-x86_64.exe\` · **macOS** \`Encore-$V-macos-universal.dmg\` (if macOS will not open it the first time: System Settings → Privacy & Security → Open Anyway) · **Linux** \`Encore-$V-linux-x86_64.AppImage\` or \`encore_${V}_amd64.deb\` · checksums in \`SHA256SUMS\`
        EOT
        elif compgen -G "$OUT/Encore-android-*.apk" >/dev/null || compgen -G "$OUT/Encore-*-windows-*.exe" >/dev/null \
          || compgen -G "$OUT/Encore-*-linux-x86_64.AppImage" >/dev/null || compgen -G "$OUT/Encore-*-macos-universal.dmg" >/dev/null; then
          # some apps built, some didn't: name what is attached
          have() { compgen -G "$OUT/$1" >/dev/null; }
          if have "Encore-android-$V.apk"; then echo "* **Android**: \`Encore-android-$V.apk\`" >> "$NOTES"; else echo "* **Android**: not in this release (its build did not finish); the next release has it" >> "$NOTES"; fi
          D=""; M=""
          if have "Encore-$V-windows-x86_64.exe"; then D="$D **Windows** \`Encore-$V-windows-x86_64.exe\` ·"; else M="$M Windows,"; fi
          if have "Encore-$V-macos-universal.dmg"; then D="$D **macOS** \`Encore-$V-macos-universal.dmg\` (if macOS will not open it the first time: System Settings → Privacy & Security → Open Anyway) ·"; else M="$M macOS,"; fi
          if have "Encore-$V-linux-x86_64.AppImage"; then D="$D **Linux** \`Encore-$V-linux-x86_64.AppImage\` or \`encore_${V}_amd64.deb\` ·"; else M="$M Linux,"; fi
          if [ -n "$D" ]; then echo "* **Desktop app** (native, with Cadenza playing on this computer; it updates itself):$D checksums in \`SHA256SUMS\`" >> "$NOTES"; fi
          if [ -n "$M" ]; then echo "* **Not in this release:**${M%,} desktop app – its build did not run this time; the next release has it" >> "$NOTES"; fi
        else echo "* **Apps**: the desktop and Android apps were not rebuilt for this release – the ones attached are from the last build that made them." >> "$NOTES"; fi
