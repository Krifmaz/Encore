name: release

# Every run makes a normal GitHub release tagged v<version>. Versions are plain MAJOR.MINOR.PATCH: by
# default the next number bumps PATCH of the newest release; pick "minor"/"major" or type the version
# by hand (e.g. 1.0.0). The tag is created through the release (the API may create tags; a git push
# from the Actions token may not).
#   Start one: Actions → release → Run workflow.
#   Tick "apps" to also build the desktop installers and the Android APK (the macOS runner costs 10× minutes,
#   so they are off by default and a release without them is just the server + Docker image). They can be
#   built on your own machine instead and attached to the release: scripts/release-apps.sh.
#   Docker: :<version> and :latest.
#   Notes: docs/releases/<version>.md if it exists, otherwise the commit list since the previous release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number to bump for the next version"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or type the version to release (MAJOR.MINOR.PATCH); overrides bump"
        type: string
        default: ""
      apps:
        description: "Also build desktop + Android apps (slow, costs macOS minutes)"
        type: boolean
        default: false
      only:
        description: "Build only part of it: 'android' = just the Android APK; the server, Docker image and desktop apps are carried over from the previous release"
        type: choice
        options: [all, android]
        default: all

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      semver: ${{ steps.v.outputs.semver }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
          WANT: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semver() { echo "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "$WANT" ]; then
            V="${WANT#v}"
          else
            # the newest version so far: release tags (v0.20.1 …)
            LAST=$(gh release list --limit 200 --json tagName -q '.[].tagName' 2>/dev/null | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' \
                    | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ -z "$LAST" ]; then
              V="0.20.0"                               # the first numbered release after the date-based ones
            else
              IFS=. read -r A B C <<< "$LAST"
              case "$BUMP" in
                major) V="$((A + 1)).0.0" ;;
                minor) V="$A.$((B + 1)).0" ;;
                *)     V="$A.$B.$((C + 1))" ;;
              esac
            fi
          fi
          semver "$V" || { echo "bad version $V (want MAJOR.MINOR.PATCH)"; exit 1; }
          IFS=. read -r A B C <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # desktop installers (Tauri) take the same semver
          echo "semver=$V" >> "$GITHUB_OUTPUT"
          # Android versionCode, always increasing and above the old date-based codes (26101302 …):
          # 260000000 + major*1000000 + minor*10000 + patch*10
          echo "code=$(( 260000000 + A * 1000000 + B * 10000 + C * 10 ))" >> "$GITHUB_OUTPUT"
          echo "Version $V"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
        working-directory: server
      - run: for f in $(find web/js -name '*.js'); do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done

  # the web app in Rust/WebAssembly (web-rs) → static/next, packed into the Linux tarballs (the image builds it itself)
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-rs
      - run: curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin trunk
      - run: trunk build --release
        working-directory: web-rs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-next
          path: web-rs/dist

  server:
    needs: [version, test, ui]
    if: inputs.only != 'android'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - if: matrix.arch == 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        working-directory: server
        env:
          ENCORE_VERSION: ${{ needs.version.outputs.version }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ui-next
          path: web/next
      - name: Package
        run: |
          V=${{ needs.version.outputs.version }}
          mkdir -p out/encore && cp server/target/${{ matrix.target }}/release/encore out/encore/ && cp -r web out/encore/static
          tar -C out -czf encore-$V-linux-${{ matrix.arch }}.tar.gz encore
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: "*.tar.gz"

  docker:
    needs: [version, test]
    if: inputs.only != 'android'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          I="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/encore"
          T="$I:${{ needs.version.outputs.version }},$I:latest"
          echo "tags=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            ENCORE_BUILD=${{ github.sha }}
            ENCORE_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apps:
    needs: [version, test]
    if: inputs.apps || inputs.only == 'android'
    uses: ./.github/workflows/apps.yml
    with:
      version: ${{ needs.version.outputs.version }}
      semver: ${{ needs.version.outputs.semver }}
      code: ${{ needs.version.outputs.code }}
      only: ${{ inputs.only == 'android' && 'android-native' || 'all' }}
    # the Android release key lives in repository secrets; a called workflow only sees them when passed on
    secrets: inherit

  publish:
    needs: [version, server, docker, apps]
    if: >-
      always() && (
        (inputs.only == 'android' && needs.apps.result == 'success') ||
        (inputs.only != 'android' && needs.server.result == 'success' && needs.docker.result == 'success' && (needs.apps.result == 'success' || needs.apps.result == 'skipped'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # only our files (the Docker build record artifact can't be downloaded this way)
      - uses: actions/download-artifact@v4
        if: inputs.only != 'android'
        with:
          pattern: server-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.apps.result == 'success'
        with:
          pattern: Encore-*
          path: out
          merge-multiple: true
      - name: Files and notes
        env:
          APPS: ${{ needs.apps.result }}
          ONLY: ${{ inputs.only }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ needs.version.outputs.version }}; SV=${{ needs.version.outputs.semver }}
          if [ "$ONLY" = android ]; then
            # Android only: keep every other file of the newest release, swap in the new APK
            mkdir -p keep && gh release download --dir keep 2>/dev/null || true   # the newest release
            rm -f keep/Encore-android-*.apk keep/docker-compose.yml
            mv keep/* out/ 2>/dev/null || true
          fi
          # desktop installers carry the npm version in their names – show the real one
          if [ "$SV" != "$V" ]; then for f in out/*"$SV"*; do [ -e "$f" ] && mv "$f" "${f//$SV/$V}"; done; fi
          cp docker-compose.yml out/
          ls -la out
          if [ -f "docs/releases/$V.md" ]; then cp "docs/releases/$V.md" notes.md; else
            PREV=$(git tag -l 'v[0-9]*' --sort=-creatordate | head -1)
            { echo "## Changes"; git log --no-merges --pretty='- %s' ${PREV:+$PREV..}HEAD | head -60; } > notes.md
          fi
          cat >> notes.md <<EOT

          ---
          ### Install
          * **Docker**: \`ghcr.io/krifmaz/encore:latest\` (\`:$V\` pins this build) · compose file attached
          * **Linux without Docker**: \`encore-$V-linux-x86_64.tar.gz\` / \`-aarch64\` – run \`ENCORE_CONFIG_DIR=./config ENCORE_STATIC_DIR=./static ./encore\`
          EOT
          if [ "$ONLY" = android ]; then cat >> notes.md <<EOT
          * **Android**: \`Encore-android-$V.apk\` (this build) · the server, Docker image and desktop apps are from the previous release
          EOT
          elif [ "$APPS" = success ]; then cat >> notes.md <<EOT
          * **Android**: \`Encore-android-$V.apk\` · **Windows**: \`Encore-Setup-$V.exe\` · **macOS**: the .dmg (unsigned: right-click → Open the first time) · **Linux desktop**: .AppImage or .deb
          EOT
          else echo "* **Apps**: the desktop and Android apps were not rebuilt for this release – the ones attached are from the last build that made them." >> notes.md; fi
          sed -i 's/^          //' notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
          APPS: ${{ needs.apps.result }}
        run: |
          # app installers from the previous release when this run didn't build them
          if [ "$APPS" != success ]; then
            gh release download --dir out --pattern 'Encore-*' 2>/dev/null || true
          fi
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" out/* --title "Encore $V" --notes-file notes.md --target "$GITHUB_SHA" --latest
