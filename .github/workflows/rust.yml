name: rust
on:
  push:
    paths: ["server/**", "app/static/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
        working-directory: server
      - run: cargo build --release --locked
        working-directory: server
      - name: Package (Linux x86_64)
        run: |
          mkdir -p out/encore && cp server/target/release/encore out/encore/ && cp -r app/static out/encore/static
          tar -C out -czf encore-rust-linux-x86_64.tar.gz encore
      - uses: actions/upload-artifact@v4
        with:
          name: encore-rust
          path: encore-rust-linux-x86_64.tar.gz

  # preview image + rolling pre-release while the Rust server is being finished (default branch only)
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/krifmaz/encore:rust-preview
          build-args: ENCORE_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max
      - uses: actions/download-artifact@v4
        with:
          name: encore-rust
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-preview
          name: Encore 2 (Rust) – preview
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: encore-rust-linux-x86_64.tar.gz
          body: |
            **Preview of Encore 2, the Rust server.** Not ready to replace Encore 1 yet – it is built in phases
            (see docs/RUST_PLAN.md). Uses the same database, so you can point it at a *copy* of your /config to try it.

            * Docker: `ghcr.io/krifmaz/encore:rust-preview` (port 8080, mount /config)
            * Linux binary: `encore-rust-linux-x86_64.tar.gz` – run `ENCORE_CONFIG_DIR=./config ENCORE_STATIC_DIR=./static ./encore`

            Versions: Encore 1.x is the current Python server (`:latest`). Encore 2.0.0 previews are published here
            and become `:latest` when every phase is done.
