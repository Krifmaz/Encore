name: android

# The Android app (clients/android) on pull requests that change it: unit tests and a debug build. The release
# APK is still built only by apps.yml (a release with "apps" ticked). The app builds Krifmaz/kit's kit-compose from
# source at clients/android/kit.properties (settings.gradle.kts), so no token or package setting is needed.
on:
  pull_request:
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Gradle version
        # no gradlew/wrapper jar is committed: run the Gradle the wrapper properties name (as apps.yml does)
        id: gradle
        run: |
          G=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' clients/android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$G" ] || { echo "::error::no Gradle version in clients/android/gradle/wrapper/gradle-wrapper.properties"; exit 1; }
          echo "version=$G" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Unit tests
        run: gradle -p clients/android --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Debug build
        # without cargo-ndk the Cadenza library is skipped with a warning (cadenza/build.gradle.kts); fine for a check
        run: gradle -p clients/android --no-daemon --stacktrace :app:assembleDebug
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: clients/android/app/build/reports/tests/
          if-no-files-found: ignore
