name: catalog-links

# By hand only: checks that every download the plugin catalog (server/crates/plugins/catalog/*.toml) points at
# still resolves the way Encore's installer finds it – the newest release asset for each arch, the pinned
# versions, the PyPI packages and the Translator's model files – over https, and that every sum the manifests
# name is there (a SHA256SUMS file, GitHub's digest, Hugging Face's sha256). It changes and publishes nothing.
# scripts/catalog-links.py does the work; its summary lands on the run's page.
on:
  workflow_dispatch:
    inputs:
      download:
        description: "Also download every release asset and compare it with its sha256"
        type: boolean
        default: false
      models:
        description: "With the downloads: the Translator's model files too (several GB each)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve every catalog download and sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD: ${{ inputs.download && '--download' || '' }}
          MODELS: ${{ inputs.models && '--models' || '' }}
        run: python3 -I scripts/catalog-links.py server/crates/plugins/catalog $DOWNLOAD $MODELS
