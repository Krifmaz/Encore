name: mac-backfill

# Adds the macOS desktop app to a release that was published without it. That happens when the release's Mac job
# never got a runner (GitHub cancels a job no runner takes within about 15 minutes) or failed: the release goes out
# with everything else, and its notes say the Mac app is missing.
#   Start one: Actions → mac-backfill → Run workflow, with the release's version (0.42.5).
# It builds Encore-<version>-macos-universal.dmg at that release's tag, the same way release.yml's desktop job does
# (scripts/desktop-package.sh --stamp --universal, signed when the macOS secrets exist), then uploads it to the
# release, adds it to SHA256SUMS (the desktop app's updater installs only files listed there with that hash) and
# fixes the notes' download line. Nothing else in the release changes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release to complete (MAJOR.MINOR.PATCH, e.g. 0.42.5)"
        type: string
        required: true
      runner:
        description: "The Mac runner (macos-15-intel by default; macos-latest is arm64, short of machines at times)"
        type: choice
        options: [macos-15-intel, macos-latest]
        default: macos-15-intel

permissions:
  contents: write

# one backfill per release at a time: a second run for the same version waits instead of racing the upload
concurrency:
  group: mac-backfill-${{ inputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        env:
          V: ${{ inputs.version }}
        run: |
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version $V (want MAJOR.MINOR.PATCH)"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"

  # the Mac job of the release's desktop build (the Krifmaz kit's kit-desktop, as release.yml calls it), at the
  # release's tag
  build:
    needs: version
    uses: Krifmaz/kit/.github/workflows/kit-desktop.yml@3262a89a54fdb51b9bd62bd2f8366fdf4d2f6160
    with:
      app-name: Encore
      version: ${{ needs.version.outputs.v }}
      systems: macos
      ref: v${{ needs.version.outputs.v }}
      macos-runner: ${{ inputs.runner }}
      project-dir: clients/desktop
      package-script: scripts/desktop-package.sh
      macos-files: "Encore-{V}-macos-universal.dmg"
    secrets:
      macos-cert-p12-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      macos-sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
      apple-app-password: ${{ secrets.APPLE_APP_PASSWORD }}

  attach:
    # on Linux: the upload and the notes need no Mac minutes
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Encore-desktop-macOS
          path: out
      - name: Upload, SHA256SUMS and notes
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; V="${V#v}"; DMG="Encore-$V-macos-universal.dmg"
          # SHA256SUMS of the release, without an older line for this file, plus the new one
          gh release download "v$V" --pattern SHA256SUMS --dir sums
          grep -v "  $DMG\$" sums/SHA256SUMS > out/SHA256SUMS || true
          (cd out && sha256sum -- "$DMG" >> SHA256SUMS && cat SHA256SUMS)
          gh release upload "v$V" "out/$DMG" out/SHA256SUMS --clobber
          # the notes: the macOS download in the desktop line, and macOS out of the "Not in this release" line
          gh release view "v$V" --json body -q .body > notes.md
          MAC="**macOS** \`$DMG\` (if macOS will not open it the first time: System Settings → Privacy & Security → Open Anyway) ·"
          if ! grep -q "\`$DMG\`" notes.md; then
            if grep -q '^\* \*\*Desktop app\*\*' notes.md; then
              sed -i "/^\* \*\*Desktop app\*\*/ s/ checksums in/ ${MAC//&/\\&} checksums in/" notes.md
            else
              echo "* **Desktop app** (native, with Cadenza playing on this computer; it updates itself): $MAC checksums in \`SHA256SUMS\`" >> notes.md
            fi
          fi
          # "Not in this release: Windows, macOS desktop app – …": macOS leaves the list, the line goes when it empties
          sed -i -E '/^\* \*\*Not in this release:\*\*/ { s/ macOS,//; s/, macOS / /; s/\*\* macOS desktop/** desktop/; }' notes.md
          sed -i -E '/^\* \*\*Not in this release:\*\* desktop app/d' notes.md
          gh release edit "v$V" --notes-file notes.md
