name: test-and-build

# Encore: the server + web app. Runs the tests and checks that the Docker image builds – on pull
# requests and by hand only, to keep Actions minutes down. Images are only published by the release
# workflow: :latest and :<version>. The tests are release.yml's test job (the server's tests and clippy
# for every crate, the web app's checks, the Cadenza pins); a run started by hand also puts the speed table
# in the package job's summary.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # the same tests as a release (release.yml's test job, called with only = test)
  test:
    uses: ./.github/workflows/release.yml
    with:
      only: test

  # the web app and the Linux build a pull request can be tried with (encore-linux artifact)
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            web-rs
      - name: Build the web app (trunk)
        working-directory: web-rs
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin trunk
          trunk build --release
          for f in index.html sw.js share.html css/app.css manifest.webmanifest; do test -f "dist/$f" || { echo "dist/$f missing"; exit 1; }; done
          ls dist/encore-web-*_bg.wasm
      - run: cargo build --release --locked
        working-directory: server
      - name: Package (Linux x86_64)
        run: |
          mkdir -p out/encore && cp server/target/release/encore out/encore/ && cp -r web-rs/dist out/encore/static
          tar -C out -czf encore-linux-x86_64.tar.gz encore
      - uses: actions/upload-artifact@v4
        with:
          name: encore-linux
          path: encore-linux-x86_64.tar.gz
      # The speed table (server/benches/perf.rs, the same as docs/perf/) in the job summary, only when the
      # workflow is started by hand (Actions → test-and-build → Run workflow on the branch): the bench builds the
      # API crate a second time with its test helper and links the whole program again with fat LTO, which costs
      # a quarter of an hour of runner time; release.yml runs it on every release. A GitHub runner is another
      # machine with other neighbours: compare its numbers only with other runs here, not with docs/perf/.
      - name: Speed table (cargo bench --bench perf)
        if: github.event_name == 'workflow_dispatch'
        working-directory: server
        run: |
          # -p encore: a bench across the workspace would turn on encore-core's test-only fault-io feature
          # (through encore-api's and encore-requests' dev-dependencies), which refuses a release build
          cargo bench -p encore --locked --bench perf > perf.md
          { echo "## Speed table (release build, GitHub runner)"; cat perf.md; } >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: ENCORE_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
