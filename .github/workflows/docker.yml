name: test-and-build

# Encore: the server + web app. Runs the tests and checks that the Docker image builds – on pull
# requests and by hand only, to keep Actions minutes down. Images are only published by the release
# workflow: :latest and :<version>.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
        working-directory: server
      - name: Check the web app's JavaScript parses
        run: for f in $(find web/js -name '*.js'); do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done
      - run: cargo build --release --locked
        working-directory: server
      - name: Package (Linux x86_64)
        run: |
          mkdir -p out/encore && cp server/target/release/encore out/encore/ && cp -r web out/encore/static
          tar -C out -czf encore-linux-x86_64.tar.gz encore
      - uses: actions/upload-artifact@v4
        with:
          name: encore-linux
          path: encore-linux-x86_64.tar.gz

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: ENCORE_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
