name: test-and-build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # the Python image only rebuilds when the Python app changes (not for Rust/docs-only pushes)
    paths-ignore: ["server/**", "docs/**", ".github/workflows/rust.yml", "clients/**"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: cd tests && python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lower-case owner)/encore
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/encore" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: default
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ENCORE_BUILD=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
