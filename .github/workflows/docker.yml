name: test-and-build

# Encore: the Rust server + web app. Tests run on every push; the default branch publishes the
# untested in-between image :dev (linux/amd64 + arm64). :latest / :edge / :<version> come from the release workflow.
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "clients/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
        working-directory: server
      - name: Check the web app's JavaScript parses
        run: for f in $(find web/js -name '*.js'); do node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }; done
      - run: cargo build --release --locked
        working-directory: server
      - name: Package (Linux x86_64)
        run: |
          mkdir -p out/encore && cp server/target/release/encore out/encore/ && cp -r web out/encore/static
          tar -C out -czf encore-linux-x86_64.tar.gz encore
      - uses: actions/upload-artifact@v4
        with:
          name: encore-linux
          path: encore-linux-x86_64.tar.gz

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lower-case owner)/encore
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/encore" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=dev,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENCORE_BUILD=${{ github.sha }}
            ENCORE_VERSION=dev
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
