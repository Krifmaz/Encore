name: test-and-build

# Encore: the server + web app. Runs the tests and checks that the Docker image builds – on pull
# requests and by hand only, to keep Actions minutes down. Images are only published by the release
# workflow: :latest and :<version>.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            web-rs
      - run: cargo test --locked
        working-directory: server
      - name: Check the web app (web-rs) for WebAssembly, clippy and its tests (the strings reference among them)
        working-directory: web-rs
        run: |
          cargo check --locked --target wasm32-unknown-unknown
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked
      - name: Build the web app (trunk)
        working-directory: web-rs
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin trunk
          trunk build --release
          for f in index.html sw.js share.html css/app.css manifest.webmanifest; do test -f "dist/$f" || { echo "dist/$f missing"; exit 1; }; done
          ls dist/encore-web-*_bg.wasm
      - run: cargo build --release --locked
        working-directory: server
      - name: Package (Linux x86_64)
        run: |
          mkdir -p out/encore && cp server/target/release/encore out/encore/ && cp -r web-rs/dist out/encore/static
          tar -C out -czf encore-linux-x86_64.tar.gz encore
      - uses: actions/upload-artifact@v4
        with:
          name: encore-linux
          path: encore-linux-x86_64.tar.gz

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: ENCORE_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
