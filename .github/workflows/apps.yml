name: apps

# Android APK + desktop apps (Windows, macOS, Linux). Pushes build them as workflow artifacts (CI);
# the release workflow calls this with a version and attaches them to the release.
on:
  push:
    branches: ["**"]
    paths: ["clients/**", ".github/workflows/apps.yml", "web/icons/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      semver:
        type: string
        required: true
      code:
        type: string
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        env:
          ENCORE_VERSION_CODE: ${{ inputs.code || github.run_number }}
          ENCORE_VERSION_NAME: ${{ inputs.version || format('dev.{0}', github.run_number) }}
        run: gradle -p clients/android assembleRelease --no-daemon --stacktrace
      - run: cp clients/android/app/build/outputs/apk/release/app-release.apk "Encore-android${{ inputs.version && format('-{0}', inputs.version) || '' }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-android
          path: Encore-android*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: npm ci
      - name: Version
        if: inputs.semver
        run: npm pkg set version=${{ inputs.semver }}
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"     # unsigned builds (macOS: right-click → Open the first time)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-desktop-${{ runner.os }}
          path: |
            clients/desktop/dist/*.AppImage
            clients/desktop/dist/*.deb
            clients/desktop/dist/*.exe
            clients/desktop/dist/*.dmg
            clients/desktop/dist/*.zip
          if-no-files-found: ignore
