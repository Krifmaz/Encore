name: apps

# Android APK + desktop apps (Windows, macOS, Linux), built by hand to try them: Actions → apps → Run workflow
# ("only" picks a single job). Never runs on push – the macOS runner alone costs 10× Actions minutes. A release
# builds them through release.yml with "apps" ticked, which attaches the installers to the release; the jobs here
# are the same ones (the Krifmaz kit's kit-android and kit-desktop, with release.yml's settings), with version
# dev.<run number>. The Android APK is the native app (clients/android); the desktop app is the native one
# (clients/desktop, Iced).
#   Android: signed with the permanent release key from the ANDROID_KEYSTORE_* secrets; without them this run warns
#   and signs with the runner's debug key (installs, but won't update a release build).
#   Desktop: scripts/desktop-package.sh, signed when the WINDOWS_CERT_* / MACOS_CERT_* secrets exist.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build only this job (all = every job below)"
        type: choice
        options: [all, android-native, desktop]
        default: all

permissions:
  contents: read

jobs:
  android-native:
    if: inputs.only == 'all' || inputs.only == 'android-native'
    uses: Krifmaz/kit/.github/workflows/kit-android.yml@3262a89a54fdb51b9bd62bd2f8366fdf4d2f6160
    with:
      app-name: Encore
      project-dir: clients/android
      version-property: encore
      android-packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      build-tools: "36.0.0"
      ndk: "29.0.13846066"
      rust-targets: aarch64-linux-android,armv7-linux-androideabi
      rust-dir: clients/android/cadenza/rust
      native-libs: libencore_cadenza.so
    secrets:
      android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  desktop:
    if: inputs.only == 'all' || inputs.only == 'desktop'
    uses: Krifmaz/kit/.github/workflows/kit-desktop.yml@3262a89a54fdb51b9bd62bd2f8366fdf4d2f6160
    with:
      app-name: Encore
      project-dir: clients/desktop
      package-script: scripts/desktop-package.sh
      linux-features: cuda
      windows-features: cuda
      linux-packages: libasound2-dev libxkbcommon-dev libwayland-dev libudev-dev pkg-config file
      linux-check: bash clients/desktop/packaging/check.sh
      linux-files: "Encore-{V}-linux-x86_64.AppImage encore_{V}_amd64.deb"
      windows-files: "Encore-{V}-windows-x86_64.exe"
      macos-files: "Encore-{V}-macos-universal.dmg"
    secrets:
      windows-cert-pfx-base64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      windows-cert-password: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      macos-cert-p12-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      macos-sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
      apple-app-password: ${{ secrets.APPLE_APP_PASSWORD }}
