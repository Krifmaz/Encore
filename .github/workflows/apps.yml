name: apps

# Android APK + desktop apps (Windows, macOS, Linux). Pushes build them as workflow artifacts (CI);
# the release workflow calls this with a version and attaches them to the release.
on:
  push:
    branches: ["**"]
    paths: ["clients/**", ".github/workflows/apps.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      semver:
        type: string
        required: true
      code:
        type: string
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        env:
          ENCORE_VERSION_CODE: ${{ inputs.code || github.run_number }}
          ENCORE_VERSION_NAME: ${{ inputs.version || format('dev.{0}', github.run_number) }}
        run: gradle -p clients/android assembleRelease --no-daemon --stacktrace
      - run: cp clients/android/app/build/outputs/apk/release/app-release.apk "Encore-android${{ inputs.version && format('-{0}', inputs.version) || '' }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-android
          path: Encore-android*.apk

  desktop:
    # Tauri (Rust) app: clients/app. Unsigned installers – macOS: right-click → Open the first time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage,rpm
            args: ""
          - os: windows-latest
            bundles: nsis
            args: ""
          - os: macos-latest
            bundles: dmg
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: Build
        working-directory: clients/app
        shell: bash
        env:
          ENCORE_VERSION: ${{ inputs.version || format('dev.{0}', github.run_number) }}
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }} ${{ matrix.args }} --config '{"version":"${{ inputs.semver || '0.0.1' }}"}'
      - name: Collect
        shell: bash
        run: |
          V="${{ inputs.version || format('dev.{0}', github.run_number) }}"
          mkdir -p out
          find clients/app/target -path '*/release/bundle/*' -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' \) -print | while read -r f; do
            case "$f" in
              *.AppImage) cp "$f" "out/Encore-$V-linux-x86_64.AppImage" ;;
              *.deb)      cp "$f" "out/Encore-$V-linux-amd64.deb" ;;
              *.rpm)      cp "$f" "out/Encore-$V-linux-x86_64.rpm" ;;
              *.exe)      cp "$f" "out/Encore-Setup-$V.exe" ;;
              *.dmg)      cp "$f" "out/Encore-$V-mac.dmg" ;;
            esac
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error
