name: apps

# Android APK + desktop apps (Windows, macOS, Linux). Never runs on push – the macOS runner alone costs
# 10× Actions minutes. Start it by hand (Actions → apps → Run workflow) or through the release workflow
# with "apps" ticked, which attaches the installers to the release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      semver:
        type: string
        required: true
      code:
        type: string
        required: true

permissions:
  contents: read

jobs:
  android:
    # Tauri (Rust) app: clients/app built for Android (arm64 + arm32). Signed with the runner's debug key unless
    # ANDROID_KEYSTORE_FILE/PASSWORD, ANDROID_KEY_ALIAS/PASSWORD are set (then updates install in place).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: Signing key
        # the Gradle release config falls back to the debug key, which a fresh runner doesn't have yet.
        # Gradle looks for it under $XDG_CONFIG_HOME/.android on the runner, so pin the folder explicitly.
        run: |
          D="$HOME/.android"
          echo "ANDROID_USER_HOME=$D" >> "$GITHUB_ENV"
          mkdir -p "$D"
          [ -f "$D/debug.keystore" ] || keytool -genkeypair -v -keystore "$D/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build APK
        working-directory: clients/app
        env:
          ENCORE_VERSION: ${{ inputs.version || format('dev.{0}', github.run_number) }}
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          cargo tauri android build --ci --apk --target aarch64 --target armv7 \
            --config '{"version":"${{ inputs.semver || '0.0.1' }}","bundle":{"android":{"versionCode":${{ inputs.code || github.run_number }}}}}'
      - name: Collect
        run: |
          V="${{ inputs.version || format('dev.{0}', github.run_number) }}"
          APK=$(find clients/app/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          [ -n "$APK" ] || { echo "no APK built"; find clients/app/gen/android/app/build/outputs -type f; exit 1; }
          cp "$APK" "Encore-android-$V.apk" && ls -la Encore-android-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-android
          path: Encore-android*.apk

  desktop:
    # Tauri (Rust) app: clients/app. Unsigned installers – macOS: right-click → Open the first time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage,rpm
            args: ""
          - os: windows-latest
            bundles: nsis
            args: ""
          - os: macos-latest
            bundles: app
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: Build
        working-directory: clients/app
        shell: bash
        env:
          ENCORE_VERSION: ${{ inputs.version || format('dev.{0}', github.run_number) }}
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }} ${{ matrix.args }} --config '{"version":"${{ inputs.semver || '0.0.1' }}"}'
      # Tauri's bundle_dmg.sh drives Finder with AppleScript to lay out the window, which fails on the hosted Mac
      # runners (no Finder session) – a plain hdiutil image of the .app works everywhere
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find clients/app/target -path '*/release/bundle/macos/*.app' -maxdepth 6 -type d | head -1)
          [ -n "$APP" ] || { echo "no .app bundle"; exit 1; }
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p "$(dirname "$APP")/../dmg"
          hdiutil create -volname "Encore" -srcfolder "$STAGE" -ov -format UDZO "$(dirname "$APP")/../dmg/Encore_${{ inputs.semver || '0.0.1' }}_universal.dmg"
      - name: Collect
        shell: bash
        run: |
          V="${{ inputs.version || format('dev.{0}', github.run_number) }}"
          mkdir -p out
          find clients/app/target -path '*/release/bundle/*' -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' \) -print | while read -r f; do
            case "$f" in
              *.AppImage) cp "$f" "out/Encore-$V-linux-x86_64.AppImage" ;;
              *.deb)      cp "$f" "out/Encore-$V-linux-amd64.deb" ;;
              *.rpm)      cp "$f" "out/Encore-$V-linux-x86_64.rpm" ;;
              *.exe)      cp "$f" "out/Encore-Setup-$V.exe" ;;
              *.dmg)      cp "$f" "out/Encore-$V-mac.dmg" ;;
            esac
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error
