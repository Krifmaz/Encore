name: apps

# Android APK + desktop apps (Windows, macOS, Linux) + the desktop installers (Omnistall). Never runs on push – the
# macOS runner alone costs 10× Actions minutes. Start it by hand (Actions → apps → Run workflow; "only" picks a
# single job; "desktop" also builds the installers, "installer" only those) or through the release workflow with
# "apps" ticked, which attaches everything to the release. The release's Android APK is the native app
# (android-native); the legacy Tauri android job only runs by hand.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build only this job (all = every job below; desktop = the desktop app and its installer)"
        type: choice
        options: [all, android-native, android, desktop, installer]
        default: all
  workflow_call:
    inputs:
      only:
        # release.yml doesn't pass it: a release builds every release job (the Tauri android job never runs here)
        type: string
        required: false
        default: all
      version:
        type: string
        required: true
      semver:
        type: string
        required: true
      code:
        type: string
        required: true

permissions:
  contents: read

# A release calls this file with inputs.version set; a manual run leaves it empty (version dev.<run number>).
jobs:
  android-native:
    # Native Kotlin app: clients/android (docs/android-native/PLAN.md §11). This is the APK a release attaches as
    # Encore-android-<version>.apk. Signed with the permanent release key from the ANDROID_KEYSTORE_BASE64,
    # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD secrets. Without them a release fails;
    # a manual run warns and signs with the runner's debug key (installs, but won't update a release build).
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'android-native'
    runs-on: ubuntu-latest
    env:
      ENCORE_VERSION: ${{ inputs.version || format('dev.{0}', github.run_number) }}
      ENCORE_CODE: ${{ inputs.code || github.run_number }}
      IS_RELEASE: ${{ inputs.version != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      # Cadenza on the phone (M2, PLAN §11 steps 3–5): Rust + Android targets + cargo-ndk, so the Gradle task
      # :cadenza:cargoNdkBuild builds libencore_cadenza.so (arm64-v8a, armeabi-v7a) into the APK. Without these
      # steps the task is skipped with a warning and the APK still builds (the player uses its Kotlin DSP).
      # github.com/Krifmaz/cadenza is public, so no deploy key (decision D2).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/android/cadenza/rust
          key: android-native
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: NDK for cargo-ndk
        # cargo-ndk also finds $ANDROID_HOME/ndk/<newest> on its own; be explicit so a second NDK can't win
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.13846066"
          [ -d "$NDK" ] || { echo "::error::NDK not found at $NDK"; ls "$ANDROID_HOME/ndk" || true; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Cadenza JNI crate tests (host)
        run: cargo test --manifest-path clients/android/cadenza/rust/Cargo.toml
      - name: Gradle version
        # no gradlew/wrapper jar is committed: run the Gradle the wrapper properties name, so bumping the
        # wrapper (clients/android/gradle/wrapper/gradle-wrapper.properties) bumps CI too
        id: gradle
        run: |
          G=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' clients/android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$G" ] || { echo "::error::no Gradle version in clients/android/gradle/wrapper/gradle-wrapper.properties"; exit 1; }
          echo "Gradle $G"
          echo "version=$G" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -n "$KS_B64" ]    || MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ]   || MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ]  || MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -z "$MISSING" ]; then
            KS="$RUNNER_TEMP/release.jks"
            printf '%s' "$KS_B64" | base64 -d > "$KS" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (create it with: base64 -w0 release.jks)"; exit 1; }
            [ -s "$KS" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 decodes to an empty file"; exit 1; }
            {
              echo "ANDROID_KEYSTORE_PATH=$KS"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Release key: $KS (alias $KEY_ALIAS)"
            exit 0
          fi
          if [ "$IS_RELEASE" = true ]; then
            echo "::error title=Android signing::missing secret(s):$MISSING. A release must be signed with the permanent release key, or phones can't update. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::warning title=Android signing::missing secret(s):$MISSING – this APK is signed with the runner's throw-away debug key. It installs fresh but can't update (or be updated by) a release build."
          # the release build type falls back to the debug key; make sure the runner has one where AGP looks
          D="$HOME/.android"
          echo "ANDROID_USER_HOME=$D" >> "$GITHUB_ENV"
          mkdir -p "$D"
          [ -f "$D/debug.keystore" ] || keytool -genkeypair -v -keystore "$D/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build APK
        run: |
          gradle -p clients/android --no-daemon --stacktrace :app:assembleRelease \
            "-PencoreVersionName=$ENCORE_VERSION" "-PencoreVersionCode=$ENCORE_CODE"
      - name: Collect
        run: |
          APK=$(find clients/android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          [ -n "$APK" ] || { echo "::error::no signed release APK built"; find clients/android/app/build/outputs -type f; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          # Cadenza must be in a release APK (the Gradle task only skips when cargo-ndk is missing, which it isn't here)
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -q "lib/$abi/libencore_cadenza.so" || { echo "::error::lib/$abi/libencore_cadenza.so is missing from the APK (did :cadenza:cargoNdkBuild run?)"; unzip -l "$APK" | grep ' lib/' || true; exit 1; }
          done
          cp "$APK" "Encore-android-$ENCORE_VERSION.apk" && ls -la Encore-android-*.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-android-native
          path: Encore-android-*.apk
          if-no-files-found: error

  android:
    # LEGACY Tauri (Rust) app: clients/app built for Android (arm64 + arm32), kept until the native app has shipped
    # (deleted in M7, PLAN §11). Manual runs only: a release (workflow_call) attaches the native APK instead, so
    # this job is skipped there. Its artifact is Encore-android-legacy. Signed like android-native when the
    # ANDROID_KEYSTORE_* secrets are set, otherwise with the runner's debug key.
    if: inputs.version == '' && (inputs.only == 'all' || inputs.only == 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: Signing key
        # clients/app/gen/android reads ANDROID_KEYSTORE_FILE as a path to the keystore, so decode the base64
        # secret to a file and pass that path (the old setup passed the secret itself, which never worked).
        # Without the secrets the Gradle release config falls back to the debug key, which a fresh runner doesn't
        # have yet. Gradle looks for it under $XDG_CONFIG_HOME/.android on the runner, so pin the folder explicitly.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            KS="$RUNNER_TEMP/release.jks"
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            {
              echo "ANDROID_KEYSTORE_FILE=$KS"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Release key: $KS"
          else
            echo "::warning title=Android signing (legacy)::ANDROID_KEYSTORE_* secrets incomplete – signing with the runner's debug key"
          fi
          D="$HOME/.android"
          echo "ANDROID_USER_HOME=$D" >> "$GITHUB_ENV"
          mkdir -p "$D"
          [ -f "$D/debug.keystore" ] || keytool -genkeypair -v -keystore "$D/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build APK
        working-directory: clients/app
        env:
          ENCORE_VERSION: ${{ inputs.version || format('dev.{0}', github.run_number) }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          cargo tauri android build --ci --apk --target aarch64 --target armv7 \
            --config '{"version":"${{ inputs.semver || '0.0.1' }}","bundle":{"android":{"versionCode":${{ inputs.code || github.run_number }}}}}'
      - name: Collect
        run: |
          V="${{ inputs.version || format('dev.{0}', github.run_number) }}"
          APK=$(find clients/app/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          [ -n "$APK" ] || { echo "no APK built"; find clients/app/gen/android/app/build/outputs -type f; exit 1; }
          cp "$APK" "Encore-android-legacy-$V.apk" && ls -la Encore-android-legacy-*.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-android-legacy
          path: Encore-android-legacy-*.apk

  desktop:
    # Tauri (Rust) app: clients/app. Unsigned – macOS: right-click → Open the first time. These are the files the
    # Omnistall installer (the `installer` job below) downloads from the release; their names in the Collect step are
    # mirrored in clients/installer/encore.toml.in, so a renamed file here needs the same change there.
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage,rpm
            args: ""
          - os: windows-latest
            bundles: nsis
            args: ""
          - os: macos-latest
            bundles: app
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app
      - if: runner.os == 'Linux'
        # libasound2-dev: Cadenza's ALSA output (the embedded engine); CUDA, WASAPI and CoreAudio need no packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      # Auto-update (tauri-plugin-updater, Settings → This computer → Updates): with the TAURI_SIGNING_PRIVATE_KEY
      # secret (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD when the key has one) and the matching public key in the
      # TAURI_UPDATER_PUBKEY variable or secret (both from `cargo tauri signer generate`), the build carries the
      # public key and makes signed updater files (.sig next to the installer; a .app.tar.gz on macOS). Without
      # them the app builds as before, just without self-update – the job does not fail.
      - name: Updater signing
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUB: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PUB" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            # the public key goes into the app's config (plugins.updater.pubkey) as one JSON string
            printf '%s' "$PUB" | python3 -c 'import json,sys; print("pubkey=" + json.dumps(sys.stdin.read().strip()))' >> "$GITHUB_OUTPUT"
            echo "Updater: signed update files"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "pubkey=\"\"" >> "$GITHUB_OUTPUT"
            echo "::notice title=Desktop updates::TAURI_SIGNING_PRIVATE_KEY and/or TAURI_UPDATER_PUBKEY missing – building without self-update (see clients/app/README.md)"
          fi
      - name: Build
        working-directory: clients/app
        shell: bash
        env:
          ENCORE_VERSION: ${{ inputs.version || format('dev.{0}', github.run_number) }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater.outputs.on == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater.outputs.on == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          UPDATER: ${{ steps.updater.outputs.on }}
          PUBKEY_JSON: ${{ steps.updater.outputs.pubkey }}
        run: |
          CONF='{"version":"${{ inputs.semver || '0.0.1' }}"}'
          if [ "$UPDATER" = true ]; then
            CONF='{"version":"${{ inputs.semver || '0.0.1' }}","bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":'"$PUBKEY_JSON"'}}}'
          fi
          cargo tauri build --ci --bundles ${{ matrix.bundles }} ${{ matrix.args }} --config "$CONF"
      # Tauri's bundle_dmg.sh drives Finder with AppleScript to lay out the window, which fails on the hosted Mac
      # runners (no Finder session) – a plain hdiutil image of the .app works everywhere
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find clients/app/target -path '*/release/bundle/macos/*.app' -maxdepth 6 -type d | head -1)
          [ -n "$APP" ] || { echo "no .app bundle"; exit 1; }
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p "$(dirname "$APP")/../dmg"
          hdiutil create -volname "Encore" -srcfolder "$STAGE" -ov -format UDZO "$(dirname "$APP")/../dmg/Encore_${{ inputs.semver || '0.0.1' }}_universal.dmg"
      - name: Collect
        shell: bash
        run: |
          V="${{ inputs.version || format('dev.{0}', github.run_number) }}"
          mkdir -p out
          find clients/app/target -path '*/release/bundle/*' -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' \
              -o -name '*.AppImage.sig' -o -name '*-setup.exe.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -print | while read -r f; do
            # updater files keep their signature next to them under the release name (the signature covers the
            # content, not the name; release.yml builds latest.json from these .sig files)
            case "$f" in
              *.AppImage)        cp "$f" "out/Encore-$V-linux-x86_64.AppImage" ;;
              *.AppImage.sig)    cp "$f" "out/Encore-$V-linux-x86_64.AppImage.sig" ;;
              *.deb)             cp "$f" "out/Encore-$V-linux-amd64.deb" ;;
              *.rpm)             cp "$f" "out/Encore-$V-linux-x86_64.rpm" ;;
              *.exe)             cp "$f" "out/Encore-Setup-$V.exe" ;;
              *.exe.sig)         cp "$f" "out/Encore-Setup-$V.exe.sig" ;;
              *.dmg)             cp "$f" "out/Encore-$V-mac.dmg" ;;
              *.app.tar.gz)      cp "$f" "out/Encore-$V-mac.app.tar.gz" ;;
              *.app.tar.gz.sig)  cp "$f" "out/Encore-$V-mac.app.tar.gz.sig" ;;
            esac
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  installer:
    # The Encore installer: Omnistall (github.com/Krifmaz/Omnistall, the owner's universal installer) built from the
    # commit pinned in clients/installer/OMNISTALL_REV and branded with the manifest made from
    # clients/installer/encore.toml.in. One file per OS – Encore-Installer-<version>-windows-x86_64.exe,
    # -macos-universal.dmg, -linux-x86_64.AppImage and encore-installer_<version>_amd64.deb – that downloads the
    # matching desktop file (the ones the desktop job above makes) from the release and installs it per user.
    # Runs beside `desktop`, not after it: the manifest names the release's SHA256SUMS file (checksum_asset) instead of
    # carrying the payload hashes, so neither job waits for the other, the three OS installers need no download of the
    # desktop artifacts, and a payload rebuilt later with scripts/release-apps.sh stays installable (the script
    # updates SHA256SUMS). release.yml writes SHA256SUMS over every asset right before it publishes. No aarch64 Linux
    # installer: the desktop job builds no aarch64 payload, so there would be nothing for it to install.
    # Packaging follows Omnistall's own release.yml step by step (xtask appdir + appimagetool, xtask deb, lipo +
    # xtask app-bundle + codesign + hdiutil, brand then sign on Windows) with the same optional signing secrets:
    #   Windows: WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD
    #   macOS:   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
    # Without them the .exe is unsigned and the .app ad-hoc signed (right-click → Open the first time).
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'desktop' || inputs.only == 'installer'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # V names the files (dev.<run number> on a manual run); SV is the version inside the packages (.deb Version,
      # CFBundleVersion), which must start with a digit – a release passes the same number for both
      V: ${{ inputs.version || format('dev.{0}', github.run_number) }}
      SV: ${{ inputs.semver || format('0.0.0+dev.{0}', github.run_number) }}
      # whether the optional signing secrets exist (a step's `if` cannot read `secrets` directly)
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Omnistall revision
        id: pin
        shell: bash
        run: |
          REV=$(sed -n 's/^\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' clients/installer/OMNISTALL_REV | head -1)
          [ -n "$REV" ] || { echo "::error::clients/installer/OMNISTALL_REV holds no 40-character commit sha"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Omnistall $REV"
      - uses: actions/checkout@v4
        with:
          repository: Krifmaz/Omnistall
          ref: ${{ steps.pin.outputs.rev }}
          path: omnistall
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omnistall
          key: installer-${{ steps.pin.outputs.rev }}
      - name: Manifest
        # encore.toml at the repo root, next to omnistall/; the xtask alias (cargo run -p xtask) only resolves
        # inside the Omnistall checkout, so every xtask call below runs from there with ../ paths
        shell: bash
        run: |
          bash scripts/installer-manifest.sh "$V" encore.toml
          cat encore.toml
          cd omnistall && cargo xtask validate ../encore.toml
      - name: Build Omnistall
        working-directory: omnistall
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release --locked -p installer-gui --target aarch64-apple-darwin
            cargo build --release --locked -p installer-gui --target x86_64-apple-darwin
          else
            cargo build --release --locked -p installer-gui
          fi
      # ---- Linux: AppImage (sidecar manifest in the AppDir) + .deb (manifest at /usr/share/omnistall/manifest.toml)
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 file
      - name: Package AppImage and .deb (Linux)
        if: runner.os == 'Linux'
        working-directory: omnistall
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../out
          BIN=target/release/omnistall
          cargo xtask appdir --binary "$BIN" --out ../out/Encore-Installer.AppDir --manifest ../encore.toml --name "Encore Installer"
          curl -sSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run ../out/Encore-Installer.AppDir "../out/Encore-Installer-$V-linux-x86_64.AppImage"
          rm -rf ../out/Encore-Installer.AppDir
          cargo xtask deb --binary "$BIN" --out "../out/encore-installer_${V}_amd64.deb" --version "$SV" --arch amd64 --manifest ../encore.toml
          ls -la ../out
      # ---- macOS: universal binary → Encore Installer.app (manifest in Contents/Resources) → signed → .dmg
      - name: Universal app bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: omnistall
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../out
          lipo -create -output ../out/omnistall-universal \
            target/aarch64-apple-darwin/release/omnistall target/x86_64-apple-darwin/release/omnistall
          cargo xtask app-bundle --binary ../out/omnistall-universal --out "../out/Encore Installer.app" --version "$SV" --manifest ../encore.toml --name "Encore Installer"
          rm ../out/omnistall-universal
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Code sign (macOS)
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -n "${IDENTITY:-}" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "out/Encore Installer.app"
          else
            echo "No Developer ID: ad-hoc signing (users right-click > Open once)."
            codesign --force --deep --sign - "out/Encore Installer.app"
          fi
          codesign --verify --verbose "out/Encore Installer.app"
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          rm -rf dmg-root && mkdir dmg-root
          cp -R "out/Encore Installer.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Encore Installer" -srcfolder dmg-root -ov -format UDZO "out/Encore-Installer-$V-macos-universal.dmg"
          rm -rf "out/Encore Installer.app" dmg-root
          ls -la out
      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "out/Encore-Installer-$V-macos-universal.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "out/Encore-Installer-$V-macos-universal.dmg"
      # ---- Windows: brand (append the manifest) BEFORE signing – Authenticode hashes the whole file
      - name: Brand (Windows)
        if: runner.os == 'Windows'
        working-directory: omnistall
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../out
          cargo xtask brand --installer target/release/omnistall.exe --manifest ../encore.toml --out "../out/Encore-Installer-$V-windows-x86_64.exe"
          ls -la ../out
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "out/Encore-Installer-$env:V-windows-x86_64.exe"
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: Encore-installer-${{ runner.os }}
          path: out/*
          if-no-files-found: error
