[package]
name = "encore-app"
version = "0.0.0"
description = "Encore desktop and Android app: your Encore music server in its own window, with media keys, a tray and lock-screen controls"
authors = ["Encore"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

# One crate for every platform: the desktop binary uses main.rs, Android loads the library.
[lib]
name = "encore_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros"] }
futures-util = "0.3"
url = "2"
percent-encoding = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-encore-media = { path = "plugins/media" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
# desktop extras (src/desktop_extras.rs): global hotkeys, start with the computer, auto-update from the GitHub release
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# Cadenza inside the desktop app (src/engine.rs): the engine itself, shared-mode output everywhere. The
# per-OS tables below add the exclusive backends and CUDA; cargo unifies the features of one dependency
# spec across target tables, so the git+rev must be the same in every table. Android never pulls it.
cadenza = { git = "https://github.com/Krifmaz/cadenza", rev = "a8218b8e293504967249f29a8e618830f4aec4d8", default-features = false, features = ["cpal"] }
gethostname = "1"

[target.'cfg(target_os = "linux")'.dependencies]
cadenza = { git = "https://github.com/Krifmaz/cadenza", rev = "a8218b8e293504967249f29a8e618830f4aec4d8", default-features = false, features = ["alsa", "cuda"] }

[target.'cfg(target_os = "windows")'.dependencies]
# the taskbar thumbnail toolbar (prev / play-pause / next under the taskbar preview), src/taskbar.rs
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com"] }
cadenza = { git = "https://github.com/Krifmaz/cadenza", rev = "a8218b8e293504967249f29a8e618830f4aec4d8", default-features = false, features = ["wasapi", "cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
# the dock menu (right-click on the dock icon), src/dock.rs
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
cadenza = { git = "https://github.com/Krifmaz/cadenza", rev = "a8218b8e293504967249f29a8e618830f4aec4d8", default-features = false, features = ["coreaudio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
