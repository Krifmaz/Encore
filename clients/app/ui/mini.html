<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' ipc: http://ipc.localhost asset: http://asset.localhost https://asset.localhost; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' asset: http://asset.localhost https://asset.localhost data:">
<title>Encore mini player</title>
<style>
  /* The mini player (src/extras.rs): a small window on top of the others. Everything comes from Rust (mini_state),
     every button goes to the main window's player (player_control). The window has no title bar: drag it by the song. */
  :root { color-scheme: dark; --bg: #222224; --panel2: #2e2e31; --text: #f0ead6; --muted: #aaa493; --accent: #f0ead6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: flex; gap: 12px; padding: 12px; border: 1px solid #38383b; }
  .art { width: 106px; height: 106px; flex: none; border-radius: 8px; background: var(--panel2) center/cover no-repeat; cursor: pointer; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; gap: 6px; align-items: flex-start; }
  .meta { flex: 1; min-width: 0; cursor: default; }
  .meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title { font-weight: 650; font-size: 14px; }
  .muted { color: var(--muted); }
  button { font: inherit; border: 0; border-radius: 8px; background: none; color: var(--text); cursor: pointer; padding: 6px; display: grid; place-items: center; }
  button:hover { background: var(--panel2); }
  button.primary { background: var(--accent); color: #16161f; }
  .x { padding: 4px; color: var(--muted); }
  .ctr { display: flex; align-items: center; gap: 4px; margin-top: auto; }
  .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); height: 14px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
</style></head>
<body>
  <div class="art" id="art" title="Show Encore"></div>
  <div class="side">
    <div class="top">
      <div class="meta" data-tauri-drag-region><div class="title" id="title" data-tauri-drag-region>Nothing playing</div><div class="muted" id="artist" data-tauri-drag-region></div></div>
      <button class="x" id="close" aria-label="Close the mini player" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="ctr">
      <button id="prev" aria-label="Previous" title="Previous"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5"/></svg></button>
      <button class="primary" id="play" aria-label="Play" title="Play"><svg viewBox="0 0 24 24" id="pi"><path d="M6 4l14 8-14 8z"/></svg></button>
      <button id="next" aria-label="Next" title="Next"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg></button>
      <span class="time" id="time"></span>
    </div>
  </div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  const $ = (id) => document.getElementById(id);
  const PLAY = '<path d="M6 4l14 8-14 8z"/>', PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  const clock = (s) => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  let st = {}, dragging = false, art = null, playing = null;
  const control = (action, value) => invoke('player_control', value === undefined ? { action } : { action, value }).catch(() => {});
  function paint() {
    const none = st.stopped || !st.title;
    $('title').textContent = none ? 'Nothing playing' : st.title;
    $('artist').textContent = none ? '' : [st.artist, st.album].filter(Boolean).join(' · ');
    document.title = none ? 'Encore mini player' : `${st.title} – ${st.artist}`;
    if (art !== (st.art || '')) { art = st.art || ''; $('art').style.backgroundImage = art ? `url("${art}")` : ''; }
    if (playing !== !!st.playing) {
      playing = !!st.playing;
      $('pi').innerHTML = playing ? PAUSE : PLAY;
      $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
      $('play').title = playing ? 'Pause' : 'Play';
    }
    const dur = st.duration || 0;
    if (!dragging) $('seek').value = dur > 0 ? Math.round((st.position || 0) / dur * 1000) : 0;
    $('seek').disabled = none || dur <= 0;
    $('time').textContent = none ? '' : dur > 0 ? `${clock(st.position)} / ${clock(dur)}` : clock(st.position);
  }
  async function tick() {
    try { st = await invoke('mini_state'); paint(); } catch { /* the app is closing */ }
  }
  $('play').onclick = () => { control('toggle'); st.playing = !st.playing; paint(); };
  $('next').onclick = () => control('next');
  $('prev').onclick = () => control('prev');
  $('art').onclick = () => control('open');
  $('close').onclick = () => invoke('mini_player');
  const seek = $('seek');
  seek.oninput = () => { dragging = true; if (st.duration) $('time').textContent = `${clock(seek.value / 1000 * st.duration)} / ${clock(st.duration)}`; };
  seek.onchange = () => { dragging = false; if (st.duration) { st.position = seek.value / 1000 * st.duration; control('seek', st.position); paint(); } };
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') invoke('mini_player');
    else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); }
  });
  tick();
  setInterval(tick, 500);
</script>
</body></html>
