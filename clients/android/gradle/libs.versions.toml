# Every version is pinned (README.md, Libraries). Bump deliberately, one line at a time.
[versions]
agp = "9.4.0"
kotlin = "2.4.21"                 # also in the root build.gradle.kts buildscript classpath
composeBom = "2026.06.01"         # Compose 1.11.4, material3 1.4.0 (2026.09.00 = Compose 1.12 needs compileSdk 37, see README)
activityCompose = "1.13.0"
media3 = "1.11.1"
okhttp = "5.3.2"                  # 5.4+ needs compileSdk 37 (not on GitHub runners yet)
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
coil = "3.5.0"                     # 3.6 needs compileSdk 37 and pulls Compose 1.12
datastore = "1.2.1"               # plain DataStore (the session token is app-private, allowBackup=false)
carApp = "1.7.0"                  # androidx.car.app (Encore Lyrics car app): MapWithContentTemplate needs 1.7 / car API level 7
junit = "4.13.2"                  # unit tests only (app/src/test: the pure rules of offline, updates, bug reports)
metrics = "1.0.0"                 # JankStats (debug builds log janky frames, core/DevPerf.kt)
benchmark = "1.5.0"               # Macrobenchmark (:benchmark) and the Baseline Profile Gradle plugin (:baselineprofile, :app)
uiautomator = "2.4.0"             # the journeys (:journeys) drive the app with UiAutomator
androidxTestExtJunit = "1.3.0"    # AndroidJUnit4 runner for :benchmark and :baselineprofile
androidxTestRunner = "1.7.0"      # InstrumentationRegistry (the journeys read their instrumentation arguments)

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-network-cache-control = { group = "io.coil-kt.coil3", name = "coil-network-cache-control", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metrics" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }   # :cadenza and :journeys modules
android-test = { id = "com.android.test", version.ref = "agp" }         # :benchmark and :baselineprofile modules
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
