plugins {
    id "com.android.application"
}

android {
    namespace "app.encore.client"
    compileSdk 35

    defaultConfig {
        applicationId "app.encore.client"
        minSdk 24
        targetSdk 35
        versionCode (System.getenv("ENCORE_VERSION_CODE") ?: "1").toInteger()
        versionName System.getenv("ENCORE_VERSION_NAME") ?: "1.0.0"
    }

    def keystore = System.getenv("ANDROID_KEYSTORE_FILE")
    if (keystore) {
        // a real key from CI secrets; without one the debug key signs the APK so it still installs
        signingConfigs {
            release {
                storeFile file(keystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.core:core:1.13.1"
}
