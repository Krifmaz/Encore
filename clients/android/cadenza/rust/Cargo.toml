# Cadenza on the phone: the cadenza-dsp crate (the same engine as the server) behind a JNI surface that
# clients/android/cadenza/src/main/java/app/encore/android/cadenza/CadenzaNative.kt calls. Built for Android by
# cargo-ndk from cadenza/build.gradle.kts (cargoNdkBuild) into libencore_cadenza.so; `cargo build` / `cargo test`
# on the host build and test the engine itself (cadenza/README.md).
[package]
name = "encore-cadenza-jni"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[lib]
name = "encore_cadenza"
crate-type = ["cdylib", "rlib"]

[lints.clippy]
# Lints on top of clippy's defaults that catch wasted copies: a String or Vec copied with to_string/to_owned
# where clone (or nothing) would do, and to_string through an extra reference (the slow, generic path).
# Where CI runs clippy with -D warnings they cannot creep back in. redundant_clone and needless_collect are
# left out on purpose: they are nursery lints whose suggestions here would not compile (a value used after
# the clone it "doesn't need"; a collect that ends a borrow), so run them by hand now and then instead.
implicit_clone = "warn"
inefficient_to_string = "warn"

[dependencies]
# the same rev as server/Cargo.toml (decision D2: the cadenza repo is public, no deploy key)
cadenza-dsp = { git = "https://github.com/Krifmaz/cadenza", rev = "93c2621" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# long FIR designs and the FFT resampler must keep up in real time even in debug builds (as in server/Cargo.toml)
[profile.dev.package.cadenza-dsp]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
