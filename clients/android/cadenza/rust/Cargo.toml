# Cadenza on the phone: the cadenza-dsp crate (the same engine as the server) behind a JNI surface that
# clients/android/cadenza/src/main/java/app/encore/android/cadenza/CadenzaNative.kt calls. Built for Android by
# cargo-ndk from cadenza/build.gradle.kts (cargoNdkBuild) into libencore_cadenza.so; `cargo build` / `cargo test`
# on the host build and test the engine itself (docs/android-native/PLAN.md §6.3).
[package]
name = "encore-cadenza-jni"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[lib]
name = "encore_cadenza"
crate-type = ["cdylib", "rlib"]

[dependencies]
# the same rev as server/Cargo.toml (decision D2: the cadenza repo is public, no deploy key)
cadenza-dsp = { git = "https://github.com/Krifmaz/cadenza", rev = "93c2621" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# long FIR designs and the FFT resampler must keep up in real time even in debug builds (as in server/Cargo.toml)
[profile.dev.package.cadenza-dsp]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
