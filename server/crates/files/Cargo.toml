[package]
name = "encore-files"
description = "Encore: the admin file manager: the folders it may touch, path confinement, browse, upload, move, rename, trash and restore, tags, and import from a folder"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
encore-core = { workspace = true }
encore-config = { workspace = true }
encore-db = { workspace = true }
encore-library = { workspace = true }
encore-media = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
lofty = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
# the fault seam (a file operation on a path fails with a chosen errno): EXDEV makes a move cross devices
encore-core = { workspace = true, features = ["fault-io"] }
