# Torrent watch folder: a download client of the torznab source (sources/dl). Encore's own code talks to it; nothing to download.
# docs/contracts/plugin-manifest.md describes every key.

[plugin]
id = "torrent-blackhole"
name = "Torrent watch folder"
version = "0.32.0"
description = "Drops the .torrent and .magnet files Prowlarr finds into a folder any torrent client watches, and imports the album from the folder its finished downloads land in."
kind = "client"
protocol = 1
homepage = "https://github.com/Krifmaz/Encore"
license = "MIT"
commands = ["status", "test"]
builtin = true

[client]
source = "torznab"
protocol = "torrent"
chosen_by = "torrent_client=blackhole"

[[settings]]
key = "torrent_blackhole_watch"

[[settings]]
key = "torrent_blackhole_completed"

[permissions]
network = false
paths = [{ setting = "torrent_blackhole_watch", access = "write" }, { setting = "torrent_blackhole_completed", access = "write" }]

[migration]
in_use = [["torznab_enabled", "torrent_client=blackhole"]]
