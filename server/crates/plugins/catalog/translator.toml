# The Translator: llama.cpp's server and a local model for translated song and artist names
# (encore_library::translate). The plugin installs llama.cpp's CPU build for this machine and the model the
# translator_model setting picks. docs/contracts/plugin-manifest.md describes every key.

[plugin]
id = "translator"
name = "Translator"
version = "0.32.0"
description = "Translates and romanizes the song and album titles and artist names the other sources leave (official names, the built-in romanization, DeepL), with llama.cpp and a local model. It runs on this server at low priority, only while there is something to translate, and stops two minutes after the last one."
kind = "tool"
protocol = 1
homepage = "https://github.com/ggml-org/llama.cpp"
license = "MIT"
commands = ["status", "test", "update"]
builtin = true

[run]
# the shared libraries sit next to llama-server
env = { LD_LIBRARY_PATH = "{bin_dir}" }

# llama.cpp's builds are tagged b<number> and marked as pre-releases at times
[update]
github = "ggml-org/llama.cpp"
tag = "b{version}"
prerelease = true
sums = "github"
auto = false

[[binary]]
arch = "x86_64"
asset = ["llama-{tag}-bin-ubuntu-x64.tar.gz", "llama-{tag}-bin-ubuntu-x64.zip"]
bin = "llama-server"

[[binary]]
arch = "aarch64"
asset = ["llama-{tag}-bin-ubuntu-arm64.tar.gz", "llama-{tag}-bin-ubuntu-arm64.zip"]
bin = "llama-server"

[install]
verify = ["{bin}", "--version"]
max_mb = 1024

[[download]]
when = "translator_model=small"
url = "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
sums = "huggingface"
path = "models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
max_mb = 12288
magic = "GGUF"

[[download]]
when = "translator_model=best"
url = "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf"
sums = "huggingface"
path = "models/Qwen3-8B-Q4_K_M.gguf"
max_mb = 12288
magic = "GGUF"

# These two had no field in the settings table (the Download tools card drew them), so their words are here.
[[settings]]
key = "translator_model"
label = "Translator model"
type = "select"
options = [["small", "Small – Qwen3 4B Instruct (about 2.5 GB)"], ["best", "Best – Qwen3 8B (about 5 GB)"]]
default = "small"
help = "Small runs on most servers (about 4 GB of memory while it works); Best translates better and needs about 7 GB. It only runs while there is something to translate."

[[settings]]
key = "translate_background"
label = "Translate the whole library in the background (titles on screen are always translated first)"
type = "bool"
default = true

[permissions]
# llama-server answers Encore on 127.0.0.1, which needs the host's network
network = true
memory = 0

[migration]
from_tool = "translator"
auto_key = "tools_auto_translator"
adopt = ["tools/translator"]
# in use when its model is there (a model is gigabytes: the auto-update switch alone does not fetch one)
in_use = [["file:tools/translator/llama/current", "file:tools/translator/models"]]
