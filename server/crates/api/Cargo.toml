[package]
name = "encore-api"
description = "Encore: the web API (routers by URL prefix, the signed-in user extractors, middleware), the server state, and the web app served at /"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encore-core = { workspace = true }
encore-db = { workspace = true }
encore-config = { workspace = true }
encore-http = { workspace = true }
encore-jobs = { workspace = true }
encore-media = { workspace = true }
encore-library = { workspace = true }
encore-sync = { workspace = true }
encore-playback = { workspace = true }
encore-vpn = { workspace = true }
encore-system = { workspace = true }
encore-requests = { workspace = true }
encore-files = { workspace = true }
encore-plugins = { workspace = true }
kit-server-core = { workspace = true }
kit-server-health = { workspace = true }
kit-server-changelog = { workspace = true, features = ["server"] }
kit-server-notices = { workspace = true }
kit-server-bugreports = { workspace = true }
kit-server-diagnostics = { workspace = true }
kit-server-settings = { workspace = true, features = ["server", "toml"] }
kit-server-updates = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
bcrypt = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
totp-rs = { workspace = true }
lettre = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
urlencoding = { workspace = true }
cookie = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tower = { workspace = true }
regex = { workspace = true }
flate2 = { workspace = true }
cadenza-dsp = { workspace = true }
libc = { workspace = true }

[build-dependencies]
# embeds docs/releases (the notes half of the kit's What's new crate, without its server dependencies)
kit-server-changelog = { workspace = true }

[dev-dependencies]
# the fault seam (a file operation on a path fails with a chosen errno): EIO on the move into the library
encore-core = { workspace = true, features = ["fault-io"] }
encore-vpn = { workspace = true, features = ["test-support"] }
# the tests set artist aliases directly
encore-library = { workspace = true, features = ["test-support"] }
# the Soulseek tests talk to a stand-in slskd, in tokio's paused time
encore-requests = { workspace = true, features = ["test-support"] }
# the plugin tests install from stand-ins on 127.0.0.1 (plain http)
encore-plugins = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[features]
# the TestServer helper (a server on a temporary config folder) for other crates' tests
test-support = ["encore-plugins/test-support"]
# the fault seam of encore_core::fsx and its admin route (POST/DELETE /api/requests/storage/fault) for the
# integrator's live run: `cargo run --features fault-io`. Never a release build.
fault-io = ["encore-core/fault-io", "encore-requests/fault-io"]
