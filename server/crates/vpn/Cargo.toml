description = "Encore: the built-in WireGuard VPN for Soulseek (user-space tunnel, SOCKS5 proxy for slskd, relay of the forwarded port)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encore-core = { workspace = true }
encore-config = { workspace = true }
encore-jobs = { workspace = true }
base64 = { workspace = true }
boringtun = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
smoltcp = { workspace = true }
socket2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# lets other crates' tests run their own engine as the current tunnel
test-support = []
