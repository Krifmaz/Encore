[package]
name = "encore-config"
description = "Encore: settings (defaults, values saved in the UI, environment variables) and release types"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encore-core = { workspace = true }
encore-db = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
# the table's types, the loader and the schema answer (the kit's settings crate)
kit-server-settings = { workspace = true }

[build-dependencies]
# build.rs checks settings.toml and generates settings_gen.rs with the kit's settings crate (without its server
# half); the path is the workspace's `kit-server-settings` one, from this crate's folder
kit-server-settings = { path = "../../../../kit/crates/kit-server-settings", default-features = false, features = ["toml"] }
