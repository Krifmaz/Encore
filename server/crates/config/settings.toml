# The settings table: every server setting with its environment variable and default, and for the ones on the
# Settings pages, the words and the layout of their field. The web app's static table was the source for the words
# (labels, help, options, visibility rules). build.rs turns this file into settings_gen.rs: the `Keys` names, a typed
# accessor per key on `Config` (`cfg.app_name()`), the `TABLE` of definitions the loader reads, and `SCHEMA`, which
# GET /api/admin/settings/schema answers with. docs/contracts/settings-schema.md describes the answer.
#
# [sections.<id>]  a page under Settings → Server, in nav order: title, aliases (old ?s= links that open it).
#                  A page with no groups is drawn by its own code in the web app (Auto-download, Contribute, Blocked).
# [groups.<id>]    a card on a page, in page order: section, part (the heading over a run of cards; none when left out),
#                  title, desc, test (the card's Test button calls POST /api/system/test/<test>), test_label (its words).
# [keys.<name>]    one setting:
#   env            the environment variable that sets it (and then locks it in the UI); none for internal keys
#   default        its value when nothing is saved; its TOML type is the setting's type (bool, integer, float, string)
#   secret         true: never sent to a browser, only "set" or "not set"
#   group          the card that shows it (none: not on the generic form; `help` says where it is edited)
#   label, help    the field's words
#   type           text | password | number | bool | select | checks | textarea | path | url (path and url are text
#                  fields whose value is a folder or an address); without `type`: bool, number or text from the default
#   options        [value, label] pairs for select and checks
#   when           shown only while another select has a value: "key=value" or "key!=value"
#   unit, min, max, step   for number fields
#   full           the field takes the card's whole width
#   advanced       for people who know what they are doing (the field says so in its label)
# A card's fields are the keys that name it, in the order they appear in this file.
#
# The order of TABLE (the diagnostics page lists changed settings in this order): every key A to Z, except the keys in
# `listed_last`, which follow in the order given there (they were added after the first table and kept their place).

listed_last = [
    "email_login", "app_session_days", "lastfm_shared_secret", "acoustid_user_key", "contribute_acoustid",
    "contribute_isrc", "mb_client_id", "mb_client_secret", "mb_oauth_access_token", "mb_oauth_refresh_token",
    "mb_oauth_expires_at", "mb_oauth_account", "torznab_enabled", "prowlarr_url", "prowlarr_api_key",
    "torznab_min_seeders", "torznab_timeout_minutes", "qbit_url", "qbit_user", "qbit_password", "qbit_category",
    "qbit_download_path", "sab_url", "sab_api_key", "sab_category", "sab_download_path", "torrent_client",
    "transmission_url", "transmission_user", "transmission_password", "transmission_label",
    "transmission_download_path", "deluge_url", "deluge_password", "deluge_label", "deluge_download_path",
    "rtorrent_url", "rtorrent_user", "rtorrent_password", "rtorrent_label", "rtorrent_download_path",
    "torrent_blackhole_watch", "torrent_blackhole_completed", "nzb_client", "nzbget_url", "nzbget_user",
    "nzbget_password", "nzbget_category", "nzbget_download_path", "nzb_blackhole_watch", "nzb_blackhole_completed",
    "task_backup_enabled", "task_backup_minutes", "youtube_light_refresh", "release_types", "release_skip",
    "quality_check_on_import", "quality_min_lufs", "task_quality_enabled", "task_quality_minutes", "translator_model",
    "tools_auto_translator", "translate_background", "single_to_album",
]

