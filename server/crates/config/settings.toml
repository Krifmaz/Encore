[groups.general]
section = "general"
title = "General"
desc = "Your server's name and address, who can sign up, and how requests are approved."

[groups.grouplisten]
section = "general"
title = "Group listens"
desc = "Several people on this server hear the same songs at the same time, each on their own device. Anyone signed in can start one and invite others with a code or a link."

[groups.library]
section = "library"
title = "Library & tagging"
desc = "Where your music lives, and how downloaded files are tagged, named and organised."

[groups.verify]
section = "library"
title = "Verification & duplicates"
desc = "Listens to each download and checks it's really the song you asked for, not a remix, live or wrong track."
test = "acoustid"
test_label = "Test connection"

[groups.translations]
section = "library"
title = "Translated titles"
desc = "Where translated and romanized titles come from, strongest first: corrections by hand, official names, romanization built into the server, DeepL with your API key, and the local model when the Translator plugin is installed. Each listener turns translations on under Settings → Language, which also shows admins the state of each source."

[groups.surround]
section = "library"
title = "Surround (Dolby Atmos)"
desc = "Dolby Atmos and other 5.1 and 7.1 versions of songs, in a Surround library of their own: never in the stereo lists, shuffle, playlists or stats. Admins fetch an album's or a song's Atmos version from its page (gamdl with a wrapper-v2 server); a surround file a normal request downloads lands here too. Kodi, Plex or Jellyfin can read the folder as a library of its own."

[groups.pipeline]
section = "downloads"
title = "Download pipeline"
desc = "Which sources are searched for a request, and in what order. The first one that has it wins."

[groups.releases]
section = "downloads"
title = "Release types"
desc = "Which releases Request discography, the artist pages and New releases count, like the metadata profiles in Lidarr. Song requests skip other versions (live, remix, sped up and so on) unless the song asked for is one."

[groups.streamrip]
section = "downloads"
title = "Qobuz / Tidal / Deezer (streamrip)"
desc = "Searches Qobuz, Tidal and Deezer with your own accounts and downloads lossless (FLAC). Usually the best quality. streamrip is only used for these three: its SoundCloud support would give the same quality as yt-dlp, so SoundCloud links go through yt-dlp."
test = "streamrip"
test_label = "Test & write config"

[groups.torznab]
section = "downloads"
title = "Torrents & Usenet (Prowlarr)"
desc = "Searches your torrent and Usenet indexers (through Prowlarr) for whole albums and sends them to your torrent client (qBittorrent, Transmission, Deluge or rTorrent) or Usenet client (SABnzbd or NZBGet), or drops them into a watch folder."
test = "torznab"
test_label = "Test connection"

[groups.slskd]
section = "downloads"
title = "Soulseek"
desc = "Searches the Soulseek file-sharing network – great for FLAC and rare releases. Encore runs Soulseek for you: enter any username and password and an account is created at the first sign-in. Forward the port for the best speeds."
test = "slskd"
test_label = "Test connection"

[groups.ytdlp]
section = "downloads"
title = "YouTube Music & links (yt-dlp)"
desc = "Last-resort source: finds the song on YouTube Music. yt-dlp also downloads SoundCloud links you paste in the Downloader, along with YouTube, Bandcamp, Mixcloud and about 1,800 other sites."

[groups.youtube]
section = "downloads"
title = "YouTube sign-in"
desc = "Signs yt-dlp in to YouTube: YouTube Music Premium unlocks 256 kbps audio, and signed-in downloads see fewer bot checks. Best: connect the Encore browser extension and hand over a sign-in from a private window – Encore then owns that session and keeps it alive by itself. Pasted cookies are the backup."
test = "youtube"
test_label = "Test cookies"

[groups.spotify]
section = "integrations"
title = "Integrations"
desc = "API keys that let users connect their Spotify, Tidal, Last.fm, Discogs and YouTube Music accounts, and power recommendations."
test = "spotify"
test_label = "Test all"

[groups.media]
section = "integrations"
title = "Media servers"
desc = "Tells Navidrome, Jellyfin or Plex to rescan after new music arrives, so it shows up there right away."
test = "mediaservers"
test_label = "Trigger refresh"

[groups.roon]
section = "integrations"
title = "Roon"
desc = "Encore as a Roon extension: your Roon zones show up under Your devices with what they play, transport and volume, and “Play in Roon” starts a search result in a zone. Enable it here, then approve Encore once in Roon → Settings → Extensions."
test = "roon"
test_label = "Test connection"

[groups.cadenza]
section = "processing"
title = "Server processing (Cadenza)"
desc = "Lets permitted users have their streams upsampled on this server by Cadenza (long-filter upsampling, dither and noise shaping, lossless 24-bit FLAC out). Off by default: it costs real processor time per stream. Allow users under People → Users & permissions."
test = "cadenza"
test_label = "Test"

[groups.email]
section = "accounts"
title = "Email"
desc = "Lets Encore send password-reset and sign-in emails."
test = "email"
test_label = "Send test email"

[groups.notify]
section = "accounts"
title = "Notifications"
desc = "Get a message on Discord, ntfy or any webhook when downloads finish or fail."
test = "notify"
test_label = "Send test"

[groups.sync]
section = "tasks"
title = "Playlists & sync"
desc = "Keeps liked songs and playlists in step with Spotify, YouTube Music, Jellyfin, Plex and the rest. Runs as the “Sync likes & playlists” task above."

