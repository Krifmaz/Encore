max = 100
help = "Guests count too. A host can set a lower limit for their group."

[keys.group_listen_keep]
env = "ENCORE_GROUP_LISTEN_KEEP"
default = true
group = "grouplisten"
label = "Keep group listens through a server restart"
type = "bool"
help = "They come back paused where they were, the apps join again by themselves and the host presses play. Off: a restart ends them. Group listens nobody used for 12 hours end either way."

# ---- Downloads → Download pipeline

[keys.source_order]
env = "ENCORE_SOURCE_ORDER"
default = "tidal,deezer,slskd,torznab,ytdlp"
group = "pipeline"
label = "Source order"
type = "text"
full = true
help = "The one place to set what is searched, in order, comma-separated: qobuz, tidal, deezer (all through streamrip), slskd (Soulseek), torznab (torrents/Usenet, albums only), ytdlp (YouTube Music). Leave one out to never use it; sources you haven’t set up are skipped. Recommended (the default): qobuz, tidal, deezer, slskd, torznab, ytdlp – exact hi-res/lossless releases first, then Soulseek, then torrents/Usenet for whole albums, YouTube Music last. With Highest quality first on (the default), requests try Qobuz/Tidal/Deezer, then FLAC on Soulseek, then torrents/Usenet, then Soulseek in any format, then YouTube Music."

