label = "Allow group listens"
type = "bool"
help = "Off hides every group listen entry in the apps and ends the ones that are running"

[keys.group_listen_guests]
env = "ENCORE_GROUP_LISTEN_GUESTS"
default = false
group = "grouplisten"
label = "Let people without an account join with the invite link"
type = "bool"
help = "The host also switches “Guests can join with the link” on for their group; both must be on. Guests listen on a web page: they can't add songs or control playback, and nothing they hear is logged or scrobbled. Their access ends with the group, when they leave, or after 12 hours."

[keys.group_listen_max]
