<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in - Google Accounts</title><style>body{font-family:sans-serif;margin:40px}input{display:block;margin:12px 0;width:300px;height:32px}[role=link]{display:block;padding:12px;cursor:pointer}</style></head><body><main role="main">
