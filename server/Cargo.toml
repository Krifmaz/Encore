[workspace]
members = [".", "crates/*"]
# a plain `cargo test` / `cargo clippy` / `cargo build` in server/ covers every crate, not only the binary
default-members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

# Every crate takes its dependencies from here (`x = { workspace = true }`), so all of them build with
# one feature set and share one copy in target/.
[workspace.dependencies]
encore-core = { path = "crates/core" }
encore-db = { path = "crates/db" }
encore-config = { path = "crates/config" }
encore-http = { path = "crates/http" }
encore-jobs = { path = "crates/jobs" }
encore-media = { path = "crates/media" }
encore-library = { path = "crates/library" }
encore-sync = { path = "crates/sync" }
encore-playback = { path = "crates/playback" }
encore-vpn = { path = "crates/vpn" }
encore-system = { path = "crates/system" }
encore-requests = { path = "crates/requests" }
encore-api = { path = "crates/api" }
encore-files = { path = "crates/files" }
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
bcrypt = "0.17"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
totp-rs = { version = "5", features = ["gen_secret", "otpauth", "qr"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
urlencoding = "2"
cookie = "0.18"
lofty = "0.25"
walkdir = "2"
sha1 = "0.10"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7.20", features = ["io"] }
futures-util = "0.3.34"
tower = { version = "0.5", features = ["util"] }
regex = "1.13.1"
fancy-regex = "0.19.2"
unicode-normalization = "0.1.25"
md5 = "0.8.1"
flate2 = "1"
tokio-tungstenite = "0.26"
# built-in VPN for Soulseek: WireGuard in user space (no tun device) with its own TCP/IP stack
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4", "socket-tcp", "socket-tcp-cubic", "socket-udp"] }
socket2 = "0.6"
cadenza-dsp = { git = "https://github.com/Krifmaz/cadenza", rev = "93c2621" }
webp = { version = "0.3", default-features = false }
# the cover thumbnail pass lowers its threads' priority (setpriority)
libc = "0.2"
# quality checks on imports: spectrum of the decoded audio (fake lossless, upsampled)
rustfft = "6.4"
# "Update now": the Docker Engine API over the unix socket (HTTP/1.1 client; already in the tree via axum/reqwest)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[package]
name = "encore"
version.workspace = true
edition.workspace = true
description = "Encore music server"
license.workspace = true

[dependencies]
encore-api = { workspace = true }
encore-db = { workspace = true }
encore-jobs = { workspace = true }
encore-library = { workspace = true }
encore-playback = { workspace = true }
encore-requests = { workspace = true }
encore-system = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# a server whose file operations can be made to fail (encore_core::fsx::fault): `cargo run --features
# fault-io` with ENCORE_FAULT_IO="/music:mkdir:5" or POST /api/requests/storage/fault. Never a release build.
fault-io = ["encore-api/fault-io"]

[dev-dependencies]
# tests/ and benches/: the server through its router, on the TestServer helper
encore-api = { workspace = true, features = ["test-support"] }
axum = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
urlencoding = { workspace = true }

# the speed table of docs/perf: `cargo bench --bench perf` (a plain program, no bench harness)
[[bench]]
name = "perf"
harness = false

# The release binary: the whole program optimised as one unit (fat LTO, one codegen unit) – slower to build,
# faster to run. Panics keep unwinding (no `panic = "abort"`): the database lends its connections under
# catch_unwind so a panic in one request can't poison the write lock, and a panicking handler or blocking
# task fails that request only, not the whole server.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Cadenza's filter design and FFT resampling run in real time while streaming: keep them optimised
# even in debug builds (an unoptimised resampler can't keep up with a 64k-tap filter).
[profile.dev.package.cadenza-dsp]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
