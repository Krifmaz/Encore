[package]
name = "encore"
version = "2.0.0"
edition = "2021"
description = "Encore music server"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
bcrypt = "0.17"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
totp-rs = { version = "5", features = ["gen_secret", "otpauth", "qr"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
urlencoding = "2"
cookie = "0.18"
lofty = "0.25"
walkdir = "2"
sha1 = "0.10"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7.20", features = ["io"] }
futures-util = "0.3.34"
tower = { version = "0.5", features = ["util"] }
regex = "1.13.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
