# Encore + Lidarr + slskd. Only Encore is published to the outside world;
# Lidarr and slskd stay on the private "music" network.
services:
  encore:
    build: .
    image: ghcr.io/krifmaz/test:latest
    container_name: encore
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - ENCORE_ADMIN_USER=${ENCORE_ADMIN_USER:-admin}
      - ENCORE_ADMIN_PASSWORD=${ENCORE_ADMIN_PASSWORD:-}
      - ENCORE_CONTACT_EMAIL=${ENCORE_CONTACT_EMAIL:-}
      - ENCORE_LIBRARY_PATH=/music
      - ENCORE_STAGING_PATH=/downloads/encore
      - LIDARR_ENABLED=true
      - LIDARR_URL=http://lidarr:8686
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - SLSKD_ENABLED=true
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - SLSKD_DOWNLOAD_PATH=/downloads/slskd
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - STREAMRIP_ENABLED=${STREAMRIP_ENABLED:-false}
      - STREAMRIP_DEEZER_ARL=${STREAMRIP_DEEZER_ARL:-}
    volumes:
      - ./config/encore:/config
      - ${MUSIC_DIR:-./music}:/music
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    networks: [music]

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/lidarr:/config
      - ${MUSIC_DIR:-./music}:/music          # set /music as Lidarr's root folder
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    # No published ports: reach it via an SSH tunnel/VPN, or uncomment for LAN-only setup.
    # ports: ["127.0.0.1:8686:8686"]
    networks: [music]

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME:-}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD:-}
      - SLSKD_DOWNLOADS_DIR=/downloads/slskd
      - SLSKD_INCOMPLETE_DIR=/downloads/slskd-incomplete
      - SLSKD_SHARED_DIR=/music
      # Add the API key Encore uses in ./config/slskd/slskd.yml (see README → slskd)
    volumes:
      - ./config/slskd:/app
      - ${MUSIC_DIR:-./music}:/music:ro
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "50300:50300"   # Soulseek peer port (needed for good speeds); the web UI stays private
    networks: [music]

networks:
  music:
