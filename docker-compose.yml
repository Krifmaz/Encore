# Encore runs Soulseek itself (its Soulseek engine, slskd, is the Soulseek (slskd) plugin: install it under Settings → Plugins).
# Only Encore is published to the outside world (web UI + Soulseek peer port).
# Torrents/Usenet: add Prowlarr + qBittorrent/SABnzbd to this network, install the Torrents & Usenet (Prowlarr) plugin and
# your client's plugin under Settings → Plugins and fill in their cards.
# A new install has no plugin installed: the SOULSEEK_*, STREAMRIP_* and TORZNAB_* settings below take effect once
# their plugin is installed under Settings → Plugins (an upgrade from 0.30 keeps what was in use).
#
# Paths are absolute on purpose: relative paths (./config) resolve to odd places
# under Portainer and other stack managers. Change APPDATA/MUSIC_DIR/DOWNLOADS_DIR
# in .env (or edit the defaults below).
#
# Environment variables always win over values saved in Encore's Settings page.
# Don't wrap values in quotes in list syntax (- KEY=value, not - KEY="value").
services:
  encore:
    image: ghcr.io/krifmaz/encore:latest
    # build: .                          # or build from this repo instead
    container_name: encore
    restart: unless-stopped
    # Plugins written by other people run in full isolation only with these two (README, "Plugins"; the
    # catalog's plugins are fine without them). They switch off Docker's seccomp and AppArmor profiles for this
    # container.
    # security_opt:
    #   - seccomp=unconfined
    #   - apparmor=unconfined
    ports:
      - "8080:8080"
      - "2234:2234"   # Soulseek peer port (forward it on your router; not used while the VPN is on)
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - ENCORE_ADMIN_USER=${ENCORE_ADMIN_USER:-admin}
      - ENCORE_ADMIN_PASSWORD=${ENCORE_ADMIN_PASSWORD:-}
      - ENCORE_CONTACT_EMAIL=${ENCORE_CONTACT_EMAIL:-}
      - ENCORE_LIBRARY_PATH=/music
      - ENCORE_STAGING_PATH=/downloads/encore
      - SLSKD_ENABLED=true
      - SLSKD_DOWNLOAD_PATH=/downloads/slskd
      - SOULSEEK_USERNAME=${SOULSEEK_USERNAME:-}
      - SOULSEEK_PASSWORD=${SOULSEEK_PASSWORD:-}
      - SOULSEEK_PORT=2234
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - YTMUSIC_CLIENT_ID=${YTMUSIC_CLIENT_ID:-}
      - YTMUSIC_CLIENT_SECRET=${YTMUSIC_CLIENT_SECRET:-}
      - STREAMRIP_ENABLED=${STREAMRIP_ENABLED:-false}
      - STREAMRIP_DEEZER_ARL=${STREAMRIP_DEEZER_ARL:-}
      # Database read connections (default 4). Encore turns them off by itself when /config is on a network
      # file system (NFS, SMB/CIFS, FUSE); set this to turn them on there anyway, or to 0 for one connection.
      # - ENCORE_DB_READERS=4
    volumes:
      - ${APPDATA:-/opt/appdata}/encore:/config
      - ${MUSIC_DIR:-/srv/media/music}:/music
      - ${DOWNLOADS_DIR:-/srv/downloads}:/downloads
      # Optional, only for "Update now" (Settings → Diagnostics). Warning: the socket gives the container control
      # of Docker on this host; mount it only if you want Update now.
      # - /var/run/docker.sock:/var/run/docker.sock
    networks: [music]

  # ── Soulseek through a VPN? ───────────────────────────────────────────────
  # Encore has WireGuard built in and sends only Soulseek through it: no gluetun, no NET_ADMIN, no tun device.
  # Turn it on under Settings → Plugins → Soulseek → VPN for Soulseek (or VPN_ENABLED / VPN_WIREGUARD_CONFIG).

networks:
  music:
